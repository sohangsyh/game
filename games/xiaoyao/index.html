</style>

<script type="application/json" id="d-content">{"meta": {"topic": "逍遙遊（節錄）", "author": "莊子", "language": "zh-Hant", "audience": "DSE 中文科", "central_thesis": "無用之用：惠子以世俗眼光判定大瓠、大樹無用；莊子指出關鍵在於如何用，而看似無用之物反能免於禍害，逍遙自在。"}, "npc_slots": {"mentor": {"character_id": "G", "display_name": "莊子", "persona": "灑脫幽默，善用寓言", "costume": ["ru_hat"]}, "companion": {"character_id": "O", "display_name": "小遙", "persona": "莊子的學徒，和你一起被鎖在庫房", "costume": []}, "rival": {"character_id": "A", "display_name": "惠子", "persona": "莊子的辯友，堅信大而無用之物應該捨棄", "costume": ["coin"]}, "gatekeeper": {"character_id": "I", "display_name": "門神", "persona": "守著石門，只讓明白道理的人通過", "costume": ["lantern"]}}, "story": {"intro_rival": "這庫房裡全是大而無用的廢物！你們既然說它們有用，就自己想辦法出去吧。", "intro_mentor": "惠子把你們鎖在他的庫房了。別慌，屋裡每一件「無用」的東西，都藏著出去的線索。先四處看看。", "door_hint": "石門上有四個凹槽，要集齊四個字才能打開。"}, "units": [{"unit_id": "u1", "title": "五石之瓠", "station": {"id": "gourd", "label": "大瓠"}, "concept": "大瓠盛水不夠堅固，剖成瓢又太淺，惠子便認為它大而無用，把它打破。莊子批評他「拙於用大」。", "key_quote": "非不呺然大也，吾為其無用而掊之。", "misconceptions": ["「其堅不能自舉」是指大瓠太重，人搬不動"], "tags": {"has_evidence": true, "has_dilemma": false, "has_categories": false, "has_sequence": false, "bloom": "analyze"}, "puzzle_type": "clue_combine", "clues": [{"id": "seedbag", "label": "種子袋", "kind": "required", "text": "袋上寫著：「魏王貽我大瓠之種，我樹之成而實五石。」"}, {"id": "jar", "label": "水缸", "kind": "required", "text": "缸邊刻著：「以盛水漿，其堅不能自舉也。」用來盛水，瓠殼的硬度承受不住自身的重量。"}, {"id": "ladle", "label": "瓢", "kind": "required", "text": "一隻又平又淺的大瓢：「剖之以為瓢，則瓠落無所容。」甚麼都盛不住。"}, {"id": "note1", "label": "字條", "kind": "decoy", "text": "字條上寫：「其堅不能自舉」，意思就是大瓠太重，人根本搬不動。"}], "puzzle": {"prompt": "大瓠上掛著一把鎖，鎖上刻著問題：根據線索，惠子為甚麼要把大瓠打破？", "options": [{"text": "他認為大瓠大而無用", "correct": true}, {"text": "大瓠太重，搬不動", "trap": "note1", "why": "「其堅不能自舉」是說瓠殼不夠堅固，盛水後承受不了自身重量，不是說人搬不動。"}, {"text": "魏王下令把它銷毀", "why": "大瓠是魏王送的種子種出來的，文中沒有銷毀的命令。"}, {"text": "大瓠已經腐爛發臭", "why": "文中沒有提及腐爛。惠子說「吾為其無用而掊之」。"}]}, "reward": {"char": "無", "item": "大瓠"}, "lines": {"solved": "惠子說「非不呺然大也，吾為其無用而掊之」。但我說：「夫子固拙於用大矣！」不是大瓠沒用，是他不懂得用大的東西。", "rival_taunt": "又大又空，留著幹甚麼？"}, "hints": ["三條必要線索分別說了大瓠的哪兩種用法？", "盛水不夠堅固，做瓢又太淺。惠子由此得出甚麼結論？", "惠子說：「吾為其無用而掊之。」"]}, {"unit_id": "u2", "title": "不龜手之藥", "station": {"id": "cabinet", "label": "藥櫃"}, "concept": "同一張防止手凍裂的藥方，宋人用來世代漂洗絲絮，只得數金；客人用來說服吳王，水戰勝越，得以封地。分別在於用法不同。", "key_quote": "能不龜手一也；或以封，或不免於洴澼絖，則所用之異也。", "misconceptions": ["客人的藥方比宋人的更有效", "成敗取決於運氣或君王是否慷慨"], "tags": {"has_evidence": true, "has_dilemma": false, "has_categories": false, "has_pairs": true, "bloom": "analyze"}, "puzzle_type": "pairing", "clues": [{"id": "recipe", "label": "藥方", "kind": "required", "text": "藥方上寫：「宋人有善為不龜手之藥者，世世以洴澼絖為事。」"}, {"id": "silk", "label": "絲絮筐", "kind": "required", "text": "洴澼絖，就是在水中漂洗絲絮。宋人一家世代做這份工，所得「不過數金」。"}, {"id": "battlemap", "label": "水戰圖", "kind": "required", "text": "圖旁題字：「客得之，以說吳王。越有難，吳王使之將，冬與越人水戰，大敗越人，裂地而封之。」"}, {"id": "note2", "label": "字條", "kind": "decoy", "text": "字條上寫：客人那份藥方，一定比宋人的更靈驗，所以才能封侯。"}], "puzzle": {"prompt": "藥櫃的三格抽屜，各要配上正確的牌子。", "rows": [{"label": "宋人用藥方", "answer": 0}, {"label": "客人用藥方", "answer": 1}, {"label": "結果不同，是因為", "answer": 2}], "pool": [{"text": "世代漂洗絲絮，不過數金"}, {"text": "說服吳王，水戰勝越而封地"}, {"text": "所用之異：用法不同"}, {"text": "客人的藥方效力更強", "trap": "note2", "why": "莊子說「能不龜手一也」，兩者藥效完全相同。"}, {"text": "吳王特別慷慨", "why": "封地是因為打勝仗，關鍵在於把藥用在水戰上。"}]}, "reward": {"char": "用", "item": "藥方"}, "lines": {"solved": "「能不龜手一也；或以封，或不免於洴澼絖，則所用之異也。」同一樣東西，用法不同，價值就天差地遠。", "rival_taunt": "藥方好，才是硬道理！"}, "hints": ["比較宋人和客人：他們用的藥方一樣嗎？", "莊子說「能不龜手一也」，藥效相同，差別在哪裡？", "宋人用來漂絲絮，客人用來打水戰。答案是「所用之異」。"]}, {"unit_id": "u3", "title": "浮於江湖", "station": {"id": "basin", "label": "水盆"}, "concept": "莊子回應惠子：先批評他拙於用大，舉不龜手之藥為例，再建議把大瓠做成大樽浮於江湖，最後指他有「蓬之心」。", "key_quote": "今子有五石之瓠，何不慮以為大樽而浮於江湖，而憂其瓠落無所容，則夫子猶有蓬之心也夫！", "misconceptions": ["瓠落無所容的東西，只能丟棄"], "tags": {"has_evidence": true, "has_dilemma": false, "has_categories": false, "has_sequence": true, "bloom": "analyze"}, "puzzle_type": "sequence", "requires_item": "大瓠", "clues": [{"id": "river", "label": "江湖圖", "kind": "required", "text": "畫上題字：「何不慮以為大樽而浮於江湖？」大樽，是可以縛在身上、助人浮水的大型浮具。"}, {"id": "peng", "label": "蓬草", "kind": "required", "text": "一束彎曲叢生的蓬草。莊子說惠子「猶有蓬之心」，比喻心思茅塞、見識淺窄。"}, {"id": "note3", "label": "字條", "kind": "decoy", "text": "字條上寫：瓠落無所容，又大又淺，除了丟掉，別無他法。"}], "puzzle": {"prompt": "水盆邊有五個撥杆。按莊子回應惠子的次序，撥動其中四個。", "steps": [{"text": "批評惠子拙於用大"}, {"text": "舉不龜手之藥為例"}, {"text": "建議把大瓠做成大樽，浮於江湖"}, {"text": "指惠子有蓬之心"}], "distractor": {"text": "勸惠子把大瓠丟掉", "trap": "note3", "why": "莊子正是反對丟掉大瓠，他建議做成大樽浮於江湖。"}}, "reward": {"char": "之", "item": null}, "lines": {"solved": "大瓠盛水不堅、做瓢太淺，為甚麼不把它當作大樽，浮遊於江湖之上？只憂慮它無處可容，那是心被蓬草塞住了啊。", "rival_taunt": "做成浮具？真是異想天開！"}, "hints": ["莊子先說了一句總評，再舉例，然後才給建議。", "總評是「夫子固拙於用大矣」，例子是宋人的藥方。", "最後一步是「猶有蓬之心也夫」。"]}, {"unit_id": "u4", "title": "無何有之鄉", "station": {"id": "scrollshelf", "label": "竹簡架"}, "concept": "惠子以大樹不中繩墨比喻莊子之言大而無用。莊子以狸狌（有小用而死於罔罟）、斄牛（大而不能執鼠）作答，主張把大樹種在無何有之鄉，逍遙寢臥其下：無所可用，就不會受到傷害。", "key_quote": "不夭斤斧，物無害者。無所可用，安所困苦哉？", "misconceptions": ["「大而無用，衆所同去也」是莊子的話", "不成材的樹應該砍作柴薪"], "tags": {"has_evidence": true, "has_dilemma": false, "has_categories": false, "has_sequence": false, "bloom": "evaluate"}, "puzzle_type": "spot_the_fake", "clues": [{"id": "tree", "label": "樗樹盆景", "kind": "required", "text": "「其大本擁腫而不中繩墨，其小枝卷曲而不中規矩；立之塗，匠者不顧。」"}, {"id": "wildcat", "label": "狸狌像", "kind": "required", "text": "「卑身而伏，以候敖者；東西跳梁，不辟高下，中於機辟，死於罔罟。」靈巧有用，卻因此喪命。"}, {"id": "yak", "label": "斄牛像", "kind": "required", "text": "「其大若垂天之雲，此能為大矣，而不能執鼠。」大有大的用處，不必以捉老鼠衡量它。"}, {"id": "note4", "label": "字條", "kind": "decoy", "text": "字條上寫：連莊子自己都承認：「大而無用，衆所同去也。」"}], "puzzle": {"prompt": "竹簡架上有四卷竹簡，都自稱寫著莊子對大樹的看法。哪一卷才是真的？", "options": [{"text": "樹之於無何有之鄉，逍遙乎寢臥其下；不夭斤斧，無所可用，安所困苦哉？", "correct": true}, {"text": "今子之言，大而無用，衆所同去也。", "trap": "note4", "why": "這是惠子批評莊子的話，不是莊子的看法。"}, {"text": "不中繩墨之木，宜伐為薪，物盡其用。", "why": "莊子主張讓大樹免於斧斤，而不是砍掉它。"}, {"text": "狸狌東西跳梁，可見有用之材，必成大器。", "why": "狸狌最後「死於罔罟」，莊子用牠說明有用反招禍害。"}]}, "reward": {"char": "用", "item": null}, "lines": {"solved": "狸狌有用，卻死在陷阱裡；大樹無用，斧頭反而傷不了它。把它種在廣漠之野，在樹下逍遙寢臥，還有甚麼困苦呢？", "rival_taunt": "大而無用，大家都會離你而去！"}, "hints": ["先分清楚：哪些話是惠子說的，哪些是莊子說的？", "「大而無用，衆所同去也」出自惠子之口。", "莊子的結論是：無所可用，安所困苦哉。"]}], "final": {"chars_order": ["無", "用", "之", "用"], "arrange_prompt": "門神：「把四個字按正確次序放進凹槽，說出這間庫房的秘密。」", "question": "門神：「最後一問。莊子在這兩段對話中，想說明甚麼道理？」", "options": [{"text": "看似無用之物，善於運用便有大用，而且能免於禍害", "correct": true}, {"text": "大而無用的東西應該及早捨棄", "why": "這是惠子的看法，正是莊子要反駁的。"}, {"text": "有用的東西最終都會被毀掉，所以應該避免有用", "why": "莊子並非否定一切用處，他強調的是如何看待和運用。"}, {"text": "為人應該順從君王，才能封侯", "why": "封侯只是不龜手之藥的例子，並非全文主旨。"}], "explain": "「無用之用」：惠子以世俗標準判定事物無用，莊子提醒我們換個角度去用，並指出無用反能保全自身，逍遙自在。"}, "debrief": "惠子看見的是「無用」，莊子看見的是「怎樣用」。大瓠可以浮遊江湖，大樹可以讓人逍遙寢臥：這就是無用之用。"}</script>

  const b=E.mesh(new THREE.SphereGeometry(.5,12,10),E.M(0xC8452F,{emissive:0x7A1E10}),0,0,0,g);b.scale.set(.28,.34,.28);
  E.mesh(new THREE.CylinderGeometry(.09,.09,.06,8),E.M(0xE0B04B),0,.19,0,g);E.mesh(new THREE.CylinderGeometry(.09,.09,.06,8),E.M(0xE0B04B),0,-.19,0,g);E.lanterns.push(b);return g;};

/* environment */
E.ENV={
  morning:{sky:0xB9D6E2,hs:0xF4ECDC,hg:0x5C6E4C,hi:.72,sc:0xFFE2B0,si:.75,sp:[12,22,10]},
  dusk:{sky:0xE6B08A,hs:0xFFD2A8,hg:0x6A5A4A,hi:.78,sc:0xFF9E5E,si:.9,sp:[-18,9,6]},
  overcast:{sky:0xA7B0AE,hs:0xD9DED9,hg:0x5E6658,hi:.85,sc:0xDDE3E0,si:.45,sp:[4,20,6]},
  night:{sky:0x1D2A44,hs:0x8EA2CC,hg:0x2B2E3A,hi:.55,sc:0xA9BCEB,si:.38,sp:[-8,18,-6]}
};
const env=E.env={cur:{sky:new THREE.Color(),hs:new THREE.Color(),hg:new THREE.Color(),sc:new THREE.Color(),hi:1,si:1},tgt:null,pulse:0,pulseColor:new THREE.Color(0xFFD27A),dim:0};
E.setEnv=function(name,instant){const e=E.ENV[name];env.tgt=e;if(instant){env.cur.sky.set(e.sky);env.cur.hs.set(e.hs);env.cur.hg.set(e.hg);env.cur.sc.set(e.sc);env.cur.hi=e.hi;env.cur.si=e.si;}};
E.flash=function(good,color){env.pulse=1;env.pulseColor.set(color!=null?color:(good?0xFFD27A:0x2A2440));};
const dimColor=new THREE.Color(0x4E4A58),tmpC=new THREE.Color(),sunT=new THREE.Vector3();
function updateEnv(dt){
  const e=env.tgt;if(!e)return;const k=Math.min(1,dt*1.4);
  env.cur.sky.lerp(tmpC.set(e.sky),k);env.cur.hs.lerp(tmpC.set(e.hs),k);env.cur.hg.lerp(tmpC.set(e.hg),k);env.cur.sc.lerp(tmpC.set(e.sc),k);
  env.cur.hi+=(e.hi-env.cur.hi)*k;env.cur.si+=(e.si-env.cur.si)*k;sunT.set(e.sp[0],e.sp[1],e.sp[2]);E.sun.position.lerp(sunT,k);
  const dim=env.dim*.38;const sky=env.cur.sky.clone().lerp(dimColor,dim);
  env.pulse*=Math.pow(.25,dt);if(env.pulse>.01)sky.lerp(env.pulseColor,env.pulse*.35);
  scene.background.copy(sky);scene.fog.color.copy(sky);
  E.hemi.color.copy(env.cur.hs);E.hemi.groundColor.copy(env.cur.hg);E.hemi.intensity=env.cur.hi*(1-dim*.5)+env.pulse*.25;
  E.sun.color.copy(env.cur.sc);E.sun.intensity=env.cur.si*(1-dim*.6);
  const night=env.tgt===E.ENV.night;E.lanterns.forEach(l=>l.material.emissive.setHex(night?0xD8501E:0x7A1E10));
}

/* characters: slot + skin; every skin follows the character spec (body, 2 eyes, 2 legs) */
E.PAL={G:[0xFF8A1C,0xD9631A],O:[0x10C77A,0x0A9E5E],A:[0x1677E8,0x0F55B8],I:[0xFDD015,0xE5A80E],P:[0xE8577E,0xC23E63]};
E.hex=n=>'#'+n.toString(16).padStart(6,'0');
const NAVY=0x0B1F5E;
function rrect(w,h,r){const s=new THREE.Shape();s.moveTo(-w+r,0);s.lineTo(w-r,0);s.quadraticCurveTo(w,0,w,r);s.lineTo(w,h-r);s.quadraticCurveTo(w,h,w-r,h);s.lineTo(-w+r,h);s.quadraticCurveTo(-w,h,-w,h-r);s.lineTo(-w,r);s.quadraticCurveTo(-w,0,-w+r,0);return s;}
function shapeFor(id){
  const S=[];let eyes;
  if(id==='A'){const s=new THREE.Shape();s.moveTo(-.54,0);s.lineTo(.54,0);s.lineTo(0,.95);s.closePath();S.push(s);eyes=[[-.14,.3,.13],[.14,.3,.13]];}
  if(id==='I'){S.push(rrect(.27,.96,.05));eyes=[[-.15,.64,.15],[.15,.64,.15]];}
  if(id==='P'){S.push(rrect(.3,.8,.28));eyes=[[-.12,.56,.12],[.12,.56,.12]];}
  if(id==='G'){const s=new THREE.Shape(),R=.46,r=.26,cy=.47,a0=.62,a1=Math.PI*2-.72;s.absarc(0,cy,R,a0,a1,false);s.absarc(0,cy,r,a1,a0,true);S.push(s);
    const t=new THREE.Shape();const P=[[.14,.62],[.62,.62],[.62,.14],[.5,.14],[.5,.42],[.27,.19],[.18,.28],[.41,.5],[.14,.5]];t.moveTo(P[0][0],P[0][1]);P.slice(1).forEach(p=>t.lineTo(p[0],p[1]));t.closePath();S.push(t);
    eyes=[[-.16,.88,.13],[.1,.88,.13]];}
  if(id==='O'){const s=new THREE.Shape(),cy=.46;s.absarc(0,cy,.44,0,Math.PI*2,false);const hole=new THREE.Path();hole.absarc(0,cy,.25,0,Math.PI*2,true);s.holes.push(hole);S.push(s);eyes=[[-.3,.78,.13],[-.05,.88,.13]];}
  return {S,eyes};
}
E.chars={};
E.makeChar=function(slot,id,costume){
  const [col,dk]=E.PAL[id];const {S,eyes}=shapeFor(id);const M=E.M,mesh=E.mesh,box=E.box;
  const root=new THREE.Group();scene.add(root);
  const hip=new THREE.Group();hip.position.y=.47;root.add(hip);const body=new THREE.Group();hip.add(body);
  S.forEach(s=>{const g=new THREE.ExtrudeGeometry(s,{depth:.26,bevelEnabled:true,bevelThickness:.05,bevelSize:.035,bevelSegments:3,curveSegments:28});g.translate(0,0,-.13);mesh(g,M(col),0,0,0,body);});
  const eyeObjs=eyes.map(([x,y,r])=>{const g=new THREE.Group();g.position.set(x,y,.2);body.add(g);
    const o=mesh(new THREE.CylinderGeometry(r+.03,r+.03,.03,28),M(col),0,0,-.012,g);o.rotation.x=Math.PI/2;
    const w=mesh(new THREE.CylinderGeometry(r,r,.035,28),new THREE.MeshBasicMaterial({color:0xffffff}),0,0,.006,g);w.rotation.x=Math.PI/2;
    const p=mesh(new THREE.CylinderGeometry(r*.56,r*.56,.03,24),new THREE.MeshBasicMaterial({color:NAVY}),0,0,.03,g);p.rotation.x=Math.PI/2;return {g,p,x,y,r};});
  const legs=[-1,1].map(sd=>{const piv=new THREE.Group();piv.position.set(sd*.13,.47,0);root.add(piv);
    box(.115,.44,.125,col,0,-.22,0,piv);box(.118,.07,.128,dk,0,-.06,0,piv);
    const f=mesh(new THREE.SphereGeometry(.5,14,10),M(col),sd*.07,-.44,.04,piv);f.scale.set(.34,.2,.3);return piv;});
  const sh=mesh(new THREE.CircleGeometry(.48,24),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.2,depthWrite:false}),0,.02,0,root);sh.rotation.x=-Math.PI/2;
  const c={slot,id,root,hip,body,eyes:eyeObjs,legs,target:new THREE.Vector3(),speed:3,phase:Math.random()*6,blinkAt:1+Math.random()*3,blinkT:0,emote:null,emoteT:0,talk:false,face:null,lookAt:null,onArrive:null};
  root.scale.setScalar(1.25);
  const bb=new THREE.Box3().setFromObject(body);const topY=bb.max.y;
  (costume||[]).forEach(k=>{
    if(k==='goggles'){eyeObjs.forEach(e=>{const r=mesh(new THREE.TorusGeometry(e.r+.05,.025,8,24),M(0x2F4A6A),e.x,e.y,.24,body);const l=mesh(new THREE.CircleGeometry(e.r+.04,24),new THREE.MeshBasicMaterial({color:0x9FE8FF,transparent:true,opacity:.28,depthWrite:false}),e.x,e.y,.255,body);});
      const y=eyeObjs[0].y;box(Math.abs(eyeObjs[1].x-eyeObjs[0].x)+.1,.03,.02,0x2F4A6A,(eyeObjs[0].x+eyeObjs[1].x)/2,y,.24,body);}
    if(k==='cap'){const d=mesh(new THREE.SphereGeometry(.17,14,8,0,Math.PI*2,0,Math.PI/2),M(0xE0574A),0,topY-.04,0,body);d.scale.set(1,.8,1);box(.3,.025,.18,0xC23E33,0,topY-.03,.17,body);}
    if(k==='ru_hat'){box(.5,.04,.28,0x2A2A33,-.03,1.06,0,body);box(.22,.13,.2,0x2A2A33,-.03,1.14,0,body);}
    if(k==='coin'){const cn=mesh(new THREE.CylinderGeometry(.09,.09,.03,20),M(0xE8B93A,{emissive:0x4A3000}),0,.12,.205,body);cn.rotation.x=Math.PI/2;box(.04,.04,.035,0x3A2A10,0,.12,.225,body);}
    if(k==='tie'){box(.1,.05,.03,0x1E2A44,0,.36,.21,body);const t=box(.08,.22,.03,0x2F4A8A,0,.22,.21,body);}
    if(k==='hood'){const hd=mesh(new THREE.ConeGeometry(.32,.36,4),M(0x2A2F3A,{flatShading:true}),0,1.05,0,body);hd.rotation.y=Math.PI/4;}
    if(k==='beacon'){const lg=new THREE.Group();lg.position.set(0,1.32,0);body.add(lg);E.mesh(new THREE.CylinderGeometry(.12,.14,.07,12),M(0x4A4F58),0,-.04,0,lg);
      const dome=mesh(new THREE.SphereGeometry(.12,14,8,0,Math.PI*2,0,Math.PI/2),M(0x3FD08A,{emissive:0x1AA060}),0,0,0,lg);
      const pl=new THREE.PointLight(0x7CFFC0,1,8,1.5);lg.add(pl);c.lamp={g:lg,mat:dome.material.clone(),light:pl,beacon:true,baseY:1.32};dome.material=c.lamp.mat;}
    if(k==='lantern'){const lg=new THREE.Group();lg.position.set(.55,1.35,0);root.add(lg);
      const lb=mesh(new THREE.SphereGeometry(.5,14,10),M(0xC8452F,{emissive:0xFF7A2A}),0,0,0,lg);lb.scale.set(.3,.36,.3);
      mesh(new THREE.CylinderGeometry(.1,.1,.06,10),M(0xE0B04B),0,.2,0,lg);mesh(new THREE.CylinderGeometry(.1,.1,.06,10),M(0xE0B04B),0,-.2,0,lg);
      const pl=new THREE.PointLight(0xFFB050,1,9,1.5);lg.add(pl);c.lamp={g:lg,mat:lb.material.clone(),light:pl};lb.material=c.lamp.mat;}
  });
  E.chars[slot]=c;return c;
};
E.emote=function(c,type){c.emote=type;c.emoteT=0;};
E.lookFocus=null;E.lampValue=()=>.6;
const tv=new THREE.Vector3(),tv2=new THREE.Vector3(),tv3=new THREE.Vector3();
function updateChar(c,dt,t){
  const p=c.root.position;tv.copy(c.target).sub(p);tv.y=0;const dist=tv.length();let moving=false;
  if(dist>.04){moving=true;p.addScaledVector(tv.normalize(),Math.min(dist,c.speed*dt));}
  else if(c.onArrive){const f=c.onArrive;c.onArrive=null;f();}
  const yawT=moving?Math.atan2(tv.x,tv.z):(c.face!=null?c.face:Math.atan2(camera.position.x-p.x,camera.position.z-p.z));
  let dy=yawT-c.root.rotation.y;dy=Math.atan2(Math.sin(dy),Math.cos(dy));c.root.rotation.y+=dy*Math.min(1,dt*8);
  if(moving)c.phase+=dt*11;else c.phase+=(Math.round(c.phase/Math.PI)*Math.PI-c.phase)*Math.min(1,dt*10);
  const sw=Math.sin(c.phase)*(moving?.6:0);c.legs[0].rotation.x=sw;c.legs[1].rotation.x=-sw;
  let by=moving?Math.abs(Math.sin(c.phase))*.06:Math.sin(t*2+c.phase)*.008,sx=1,sy=1,rz=0;
  if(c.talk){const k=Math.sin(t*15)*.045;sy+=k;sx-=k*.6;}
  if(c.emote){c.emoteT+=dt;const e=c.emoteT;
    if(c.emote==='hop')by+=Math.max(0,Math.sin(e*9))*.35*Math.max(0,1-e/1.1);
    if(c.emote==='shake')rz=Math.sin(e*28)*.12*Math.max(0,1-e/.8);
    if(c.emote==='slump'){const f=Math.max(0,1-Math.max(0,e-1.2)/.6);sy-=.12*Math.sin(Math.min(1,e/.5)*Math.PI/2)*f;sx+=.06*f;}
    if(e>1.9)c.emote=null;}
  c.hip.position.y=.47+by;c.body.scale.set(sx,sy,1);c.body.rotation.z=rz;
  c.blinkAt-=dt;if(c.blinkAt<0){c.blinkT=.14;c.blinkAt=2+Math.random()*3.5;}
  let bl=1;if(c.blinkT>0){c.blinkT-=dt;bl=Math.max(.08,Math.abs(c.blinkT/.07-1));}
  let look;if(c.lookAt)look=tv2.copy(c.lookAt);else if(E.lookFocus&&E.lookFocus!==c)look=tv2.copy(E.lookFocus.root.position).add(tv3.set(0,1.3,0));else look=tv2.copy(camera.position);
  c.root.updateMatrixWorld();const loc=c.body.worldToLocal(look.clone());
  c.eyes.forEach(e=>{e.g.scale.y=bl;const v=tv3.set(loc.x-e.x,loc.y-e.y,loc.z-.2).normalize();e.p.position.x=v.x*e.r*.42;e.p.position.y=v.y*e.r*.42;});
  if(c.lamp){const b=E.lampValue();c.lamp.light.intensity=.25+b*1.9;if(c.lamp.beacon){c.lamp.mat.emissive.setRGB(.9-b*.8,.15+b*.6,.1+b*.3);c.lamp.light.color.setRGB(1-b*.5,.3+b*.7,.3+b*.45);}else{c.lamp.mat.emissive.setRGB(.25+b*.75,.12+b*.36,.04);c.lamp.g.position.y=1.35+Math.sin(t*1.6)*.06;c.lamp.g.rotation.z=Math.sin(t*1.3)*.08;}}
}

/* camera */
const cam=E.cam={p0:new THREE.Vector3(),p1:new THREE.Vector3(),l0:new THREE.Vector3(),l1:new THREE.Vector3(),look:new THREE.Vector3(),t:1,dur:1,res:null,idle:null};
const par={x:0,y:0,cx:0,cy:0};E.parallax=1;
addEventListener('pointermove',e=>{par.x=e.clientX/innerWidth-.5;par.y=e.clientY/innerHeight-.5;});
E.camTo=function(pos,look,dur){cam.p0.copy(camera.position);cam.l0.copy(cam.look);cam.p1.copy(pos);cam.l1.copy(look);cam.t=0;cam.dur=RM?.01:dur;return new Promise(r=>cam.res=r);};
E.camSet=function(pos,look){camera.position.copy(pos);cam.look.copy(look);cam.t=1;};
function updateCam(dt,t){
  if(cam.t<1){cam.t=Math.min(1,cam.t+dt/cam.dur);const k=cam.t*cam.t*(3-2*cam.t);camera.position.lerpVectors(cam.p0,cam.p1,k);cam.look.lerpVectors(cam.l0,cam.l1,k);if(cam.t>=1&&cam.res){const r=cam.res;cam.res=null;r();}}
  else if(cam.idle)cam.idle(t);
  par.cx+=(par.x-par.cx)*Math.min(1,dt*3);par.cy+=(par.y-par.cy)*Math.min(1,dt*3);const pk=RM?0:E.parallax;
  camera.lookAt(cam.look.x+par.cx*.6*pk,cam.look.y-par.cy*.3*pk,cam.look.z);
}

/* 3D-anchored UI */
const pv=new THREE.Vector3();
E.project=function(v,el){pv.copy(v).project(camera);if(pv.z>1||Math.abs(pv.x)>1.15||Math.abs(pv.y)>1.15){el.style.visibility='hidden';return;}
  el.style.visibility='';el.style.left=((pv.x+1)/2*canvas.clientWidth)+'px';el.style.top=((1-pv.y)/2*canvas.clientHeight)+'px';};
const bubbles=[];
E.floatBubble=function(c,text,ms){const el=document.createElement('div');el.className='bub';el.textContent=text;$('bubbles').appendChild(el);const b={c,el};bubbles.push(b);
  setTimeout(()=>{el.remove();const i=bubbles.indexOf(b);if(i>=0)bubbles.splice(i,1);},ms||3000);};
E.anchors=[];

/* loop */
const clock=E.clock=new THREE.Clock();
function frame(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  updateEnv(dt);updateCam(dt,t);
  Object.values(E.chars).forEach(c=>updateChar(c,dt,t));
  if(E.onFrame)E.onFrame(dt,t);
  bubbles.forEach(b=>E.project(tv.copy(b.c.root.position).add(tv2.set(0,2.35,0)),b.el));
  E.anchors.forEach(a=>{if(!a.el.hidden)E.project(a.pos,a.el);});
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
E.start=()=>requestAnimationFrame(frame);

/* dialog */
E.SPK={};let typing=null;
E.setTalker=function(key){Object.values(E.chars).forEach(c=>c.talk=false);E.lookFocus=null;const c=E.chars[key];if(c){c.talk=true;E.lookFocus=c;}};
E.showLine=function(key,text,quote){
  const d=$('dialog');d.hidden=false;const s=E.SPK[key]||{name:key,col:'#F4EBD6'};$('whoName').textContent=s.name;$('whoDot').style.background=s.col;
  const line=$('line');line.classList.toggle('quote',!!quote);E.setTalker(key);
  if(typing){clearInterval(typing.id);typing=null;}
  const done=()=>{const c=E.chars[key];if(c)c.talk=false;};
  if(RM){line.textContent=text;done();return Promise.resolve();}
  line.textContent='';let i=0;
  return new Promise(res=>{typing={id:setInterval(()=>{i++;line.textContent=text.slice(0,i);if(i>=text.length){clearInterval(typing.id);typing=null;done();res();}},24),
    finish:()=>{clearInterval(typing.id);typing=null;line.textContent=text;done();res();}};});
};
E.actions=function(nodes){const a=$('actions');a.innerHTML='';nodes.forEach(n=>a.appendChild(n));};
E.btn=function(cls,html,on){const b=document.createElement('button');b.className=cls;b.innerHTML=html;b.addEventListener('click',on);return b;};
E.say=async function(key,text,opt){opt=opt||{};E.actions([]);await E.showLine(key,text,opt.quote);E.setTalker('');
  return new Promise(res=>{const b=E.btn('next',opt.btn||'繼續',()=>res());E.actions([b]);b.focus({preventScroll:true});});};
E.ask=async function(key,text,options,disabled,opts){E.actions([]);await E.showLine(key,text);
  return new Promise(res=>{const n=options.map((o,i)=>{const b=E.btn('opt','<span class="k">'+'甲乙丙丁戊'[i]+'</span><span>'+o+'</span>',()=>res(i));if(disabled&&disabled.has(i))b.disabled=true;return b;});if(opts&&opts.skip)n.push(E.skipBtn(()=>res(-1)));E.actions(n);});};
E.skipBtn=(fn,label)=>E.btn('skipbtn',label||'跳過，看答案',fn);
E.hideDialog=()=>{$('dialog').hidden=true;E.setTalker('');};
E.bindDialog=()=>$('dialog').addEventListener('click',e=>{if(typing&&!e.target.closest('button'))typing.finish();});

/* assistant bubble */
E.bubble=function(title,text,ms){const b=$('assistBubble');b.innerHTML='';const t=document.createElement('div');t.className='t';const s=document.createElement('span');s.textContent=title;
  const x=document.createElement('button');x.textContent='收起';x.onclick=()=>b.hidden=true;t.append(s,x);const p=document.createElement('div');p.textContent=text;b.append(t,p);b.hidden=false;
  clearTimeout(E._bt);if(ms)E._bt=setTimeout(()=>b.hidden=true,ms);};
E.hideBubble=()=>{$('assistBubble').hidden=true;};

/* overlays */
E.overlay=function(html,dim){const o=$('overlay');o.className=dim?'dim':'';o.innerHTML=html;return o;};
E.clearOverlay=function(){const o=$('overlay');o.innerHTML='';o.className='';};
E.waitClick=sel=>new Promise(r=>document.querySelectorAll(sel).forEach(b=>b.addEventListener('click',()=>r(b))));
E.glyph=function(id){const col=E.hex(E.PAL[id][0]);const eye='<circle cx="CX" cy="CY" r="4.2" fill="#fff"/><circle cx="CX" cy="CY" r="2.3" fill="#0B1F5E"/>';
  const e=pts=>pts.map(([x,y])=>eye.replace(/CX/g,x).replace(/CY/g,y)).join('');
  const sh={A:'<path d="M17 3 L31 27 H3 Z" fill="'+col+'" stroke="'+col+'" stroke-width="2" stroke-linejoin="round"/>'+e([[13,19],[21,19]]),
    I:'<rect x="11" y="2" width="12" height="27" rx="2" fill="'+col+'"/>'+e([[13,11],[21,11]]),
    G:'<path d="M26 9 A11 11 0 1 0 26 25" stroke="'+col+'" stroke-width="6" fill="none"/><path d="M20 17 L29 17 L29 26" stroke="'+col+'" stroke-width="4" fill="none"/>'+e([[12,7],[19,7]]),
    O:'<circle cx="17" cy="17" r="10" stroke="'+col+'" stroke-width="6" fill="none"/>'+e([[10,8],[17,6]]),
    P:'<rect x="9" y="5" width="16" height="24" rx="8" fill="'+col+'"/>'+e([[14,14],[20,14]])}[id];
  return '<svg viewBox="0 0 34 34" aria-hidden="true">'+sh+'</svg>';};
})();
</script>
<script>/* Escape-room mode built on ENG */
(function(){

const E=ENG,$=E.$,V=(x,y,z)=>new THREE.Vector3(x,y,z);

window.__esc=st;
C.units.forEach(u=>{st.unlocked[u.unit_id]=ST[u.unit_id].unlocked_at_start;st.hints[u.unit_id]=0;});

E.ENV.room={sky:0x2E3A52,hs:0xFFE3C2,hg:0x4A3A30,hi:.62,sc:0xFFC08A,si:.55,sp:[-10,16,12]};

async function interact(o){

  const u=o.unit,id=u.unit_id;
  if(st.solved[id]){E.floatBubble(CP,'這個機關已經破解了。',2000);return;}

  const req=u.clues.filter(c=>c.kind==='required'),seen=req.filter(c=>st.examined[c.id]).length;
  if(seen<req.length){E.floatBubble(CP,'線索還沒找齊（'+seen+'/'+req.length+'），再四處看看。',2600);toast('線索不足','「'+u.station.label+'」附近還有 '+(req.length-seen)+' 條線索沒有調查。','');return;}

}

/* puzzles */
function wrongFx(u){st.wrongs++;E.emote(RV,'hop');E.emote(GK,'shake');E.flash(false);E.floatBubble(RV,u?u.lines.rival_taunt:'哈哈，錯了！',2400);const d=$('dialog');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');}
async function cooldown(sec){for(let s=sec;s>0;s--){$('line').dataset.cd='冷卻中（'+s+' 秒）';$('cd').textContent='冷卻中：'+s+' 秒後可再試';await E.sleep(1000);}$('cd').textContent='';}
function trap(opt){if(opt.trap)st.traps.push({clue:opt.trap,text:opt.text,why:opt.why});}
function exitBtn(res){return E.btn('ghost','離開機關',()=>res(null));}
function choose(key,prompt,opts,disabled){return new Promise(async res=>{E.actions([]);await E.showLine(key,prompt);
  const nodes=opts.map((o,i)=>{const b=E.btn('opt','<span class="k">'+'甲乙丙丁戊'[i]+'</span><span>'+o.text+'</span>',()=>res(i));if(disabled.has(i))b.disabled=true;return b;});
  const cd=document.createElement('p');cd.id='cd';cd.className='status';nodes.push(cd);if(key!=='gatekeeper')nodes.push(exitBtn(res));nodes.push(E.skipBtn(()=>res(-2)));E.actions(nodes);});}
async function puzzle(u){
  const id=u.unit_id,pz=u.puzzle;let wrong=0;st.ctx=id;
  for(;;){
    let ok=null;
    if(u.puzzle_type==='clue_combine'||u.puzzle_type==='spot_the_fake'){
      const opts=st._order&&st._order[id]||(st._order=st._order||{},st._order[id]=E.shuffle(pz.options));const dis=st._dis&&st._dis[id]||((st._dis=st._dis||{})[id]=new Set());
      const i=await choose('narrator',pz.prompt,opts,dis);if(i===null)break;if(i===-2){await solved(u,0,true);break;}
      ok=!!opts[i].correct;if(!ok){dis.add(i);trap(opts[i]);toast('不對',opts[i].why,'bad');}
    }else if(u.puzzle_type==='pairing'){const r=await pairing(u);if(r===null)break;if(r==='skip'){await solved(u,0,true);break;}ok=r;}
    else if(u.puzzle_type==='sequence'){const r=await sequence(u);if(r===null)break;if(r==='skip'){await solved(u,0,true);break;}ok=r;}
    if(ok){await solved(u,wrong);break;}
    wrong++;wrongFx(u);
    if(wrong>=ST[id].force_hint_after&&st.hints[id]<1)giveHint(id,true);
    await cooldown(ST[id].wrong_cooldown_sec);
  }
  st.ctx=null;
}
function pairing(u){const pz=u.puzzle;const pool=st._pool=st._pool||E.shuffle(pz.pool.map((p,i)=>Object.assign({i},p)));const sel=pz.rows.map(()=>null);
  return new Promise(async res=>{E.actions([]);await E.showLine('narrator',pz.prompt);
    const wrap=document.createElement('div');const draw=()=>{wrap.innerHTML='';pz.rows.forEach((row,ri)=>{const d=document.createElement('div');d.className='pz-row';d.innerHTML='<b>'+row.label+'</b>';
      const ch=document.createElement('div');ch.className='chips';pool.forEach(p=>{const b=E.btn('chipb'+(sel[ri]===p.i?' on':'')+(sel.includes(p.i)&&sel[ri]!==p.i?' used':''),p.text,()=>{const k=sel.indexOf(p.i);if(k>=0)sel[k]=null;sel[ri]=p.i;draw();});ch.appendChild(b);});d.appendChild(ch);wrap.appendChild(d);});
      sub.disabled=sel.some(s=>s===null);};
    const sub=E.btn('next','確定',()=>{const wrongRows=pz.rows.filter((r,ri)=>sel[ri]!==r.answer);wrongRows.forEach((r,k)=>{const p=pz.pool[sel[pz.rows.indexOf(r)]];if(p){trap(p);}});
      if(wrongRows.length){const p=pz.pool[sel[pz.rows.indexOf(wrongRows[0])]];toast('有 '+wrongRows.length+' 格配錯了',p&&p.why?p.why:'再看看線索中宋人和客人各自怎樣使用藥方。','bad');}res(!wrongRows.length);});
    const cd=document.createElement('p');cd.id='cd';cd.className='status';
    draw();E.actions([wrap,sub,cd,exitBtn(res),E.skipBtn(()=>res('skip'))]);});}
function sequence(u){const pz=u.puzzle;const all=st._seq=st._seq||E.shuffle(pz.steps.map((s,i)=>({text:s.text,i})).concat([Object.assign({i:-1},pz.distractor)]));const order=[];
  return new Promise(async res=>{E.actions([]);await E.showLine('narrator',pz.prompt);
    const wrap=document.createElement('div');const draw=()=>{wrap.innerHTML='';const seq=document.createElement('ol');seq.className='seqlist';
      for(let k=0;k<4;k++){const li=document.createElement('li');li.textContent=order[k]?order[k].text:'（第'+E.NUM[k]+'步）';li.className=order[k]?'':'empty';seq.appendChild(li);}wrap.appendChild(seq);
      const ch=document.createElement('div');ch.className='chips';all.forEach(p=>{const used=order.includes(p);const b=E.btn('chipb'+(used?' used':''),p.text,()=>{if(used||order.length>=4)return;order.push(p);draw();});ch.appendChild(b);});wrap.appendChild(ch);
      sub.disabled=order.length<4;};
    const sub=E.btn('next','撥動',()=>{const ok=order.every((p,k)=>p.i===k);if(!ok){const bad=order.find((p,k)=>p.i!==k);if(bad.i===-1)trap(bad);toast('順序不對',bad.i===-1?bad.why:'莊子是先總評，再舉例，然後提出建議，最後才下結論。','bad');}res(ok);});
    const reset=E.btn('ghost','重新排列',()=>{order.length=0;draw();});const cd=document.createElement('p');cd.id='cd';cd.className='status';
    draw();E.actions([wrap,sub,reset,cd,exitBtn(res),E.skipBtn(()=>res('skip'))]);});}
function ansText(u){const pz=u.puzzle;if(pz.options)return pz.options.find(o=>o.correct).text;if(pz.rows)return pz.rows.map(r=>r.label+'：'+pz.pool[r.answer].text).join('；');return pz.steps.map((x,i)=>(i+1)+'. '+x.text).join('　');}
async function solved(u,wrong,skipped){
  const id=u.unit_id,S=GM.scoring;st.solved[id]=true;const pts=skipped?0:Math.max(S.station_min,S.station_base-wrong*S.wrong_penalty);addScore(pts);if(skipped){st.skipped=(st.skipped||0)+1;await E.say('mentor','正確答案是：'+ansText(u));}
  const rw=u.reward;st.inv.chars.push(rw.char);if(rw.item)st.inv.items.push(rw.item);
  ST[id].unlocks.forEach(k=>st.unlocked[k]=true);
  stationLamps[id].material.color.setHex(0xFFD27A);stationLamps[id].material.emissive.setHex(0xC88A20);
  const p=plaques[st.inv.chars.length-1];if(p){p.material.color.setHex(0xF2C14E);p.material.emissive.setHex(0x8A5A10);}
  E.env.dim=Math.max(0,.55-Object.keys(st.solved).length*.14);E.flash(true);E.emote(MT,'hop');E.emote(CP,'hop');E.emote(RV,'slump');
  st.objs[u.station.id].el.classList.add('solved');
  toast('機關破解 +'+pts,'得到「'+rw.char+'」字'+(rw.item?'，以及物品「'+rw.item+'」':'')+'。','ok');hud();
  await E.say('mentor',u.lines.solved);
  const newly=ST[id].unlocks.map(k=>U[k].station.label);if(newly.length)await E.say('companion','咦？'+newly.join('、')+'那邊好像有動靜了！');
}

/* hints & helper */
function hintCtx(){if(st.ctx)return st.ctx;const c=C.units.find(u=>st.unlocked[u.unit_id]&&!st.solved[u.unit_id]);return c?c.unit_id:null;}
function giveHint(id,auto){id=id||hintCtx();if(!id){E.bubble('學伴','所有機關都破解了，去石門看看吧！',4000);return;}
  const u=U[id],lv=st.hints[id];if(lv>=3){E.bubble('學伴','「'+u.station.label+'」的提示已經用完了。',3000);return;}
  st.hints[id]=lv+1;if(!auto){st.hintsUsed++;addScore(-GM.scoring.hint_penalty);}
  E.bubble('學伴提示：'+u.station.label+' '+(lv+1)+'/3'+(auto?'':'（扣 '+GM.scoring.hint_penalty+' 分）'),u.hints[lv],7000);hud();}
$('assist').addEventListener('click',()=>{if(st.started&&!st.done)giveHint(null,false);});
$('help').addEventListener('click',()=>{
  if(!st.started||st.busy||st.done)return;
  const u=C.units.find(u=>st.unlocked[u.unit_id]&&!st.solved[u.unit_id]&&!st.helped[u.unit_id]&&u.clues.some(c=>c.kind==='required'&&!st.examined[c.id]));
  if(!u){E.floatBubble(CP,'我暫時幫不上忙了。',2000);return;}
  st.helped[u.unit_id]=true;const c=u.clues.find(c=>c.kind==='required'&&!st.examined[c.id]);const o=st.objs[c.id];
  st.busy=true;CP.speed=4.2;CP.target.copy(approach(o));CP.lookAt=o.pos;E.floatBubble(CP,'我去那邊看看！',1600);
  CP.onArrive=async()=>{CP.lookAt=null;E.emote(CP,'hop');st.busy=false;await examine(o,true);};hud();
});
$('notebook').addEventListener('click',()=>{if(!st.started||st.busy)return;notebook();});
async function notebook(){
  const groups=C.units.map(u=>{const cl=u.clues.filter(c=>st.examined[c.id]);return '<li><b>'+u.station.label+(st.solved[u.unit_id]?'（已破解）':'')+'</b>'+(cl.length?cl.map(c=>'<p>'+c.label+'：'+c.text+'</p>').join(''):'<p class="sub">尚未找到線索</p>')+'</li>';}).join('');
  E.overlay('<div class="card"><h2>筆記本</h2><p class="sub">找到的線索會自動記在這裡。小心：其中有些是惠子留下的誤導。</p><ul class="notes">'+groups+'</ul><button class="primary" id="go">收起</button></div>',true);
  await E.waitClick('#go');E.clearOverlay();
}

/* door */
async function doorInteract(){
  if(Object.keys(st.solved).length<4){st.busy=true;E.emote(GK,'shake');await E.say('gatekeeper',C.story.door_hint+'你已集齊 '+st.inv.chars.length+'/4 個字。');E.hideDialog();st.busy=false;return;}
  st.busy=true;GK.lookAt=null;let wrong=0;const F=C.final;
  // arrange chars
  for(;;){const r=await arrange(F);if(r==='skip'){toast('正確次序',F.chars_order.join(''),'ok');break;}if(r)break;wrong++;wrongFx(null);toast('次序不對','想想這間庫房、這篇文章的主題。','bad');if(wrong>=2)E.bubble('學伴','惠子說它們「無用」，莊子卻看見了它們的……',6000);}
  E.flash(true);plaques.forEach(p=>p.material.emissive.setHex(0xD89A20));
  const opts=E.shuffle(F.options),dis=new Set();
  for(;;){const i=await choose('gatekeeper',F.question,opts,dis);if(i===-2){await E.say('gatekeeper','答案是「'+opts.find(o=>o.correct).text+'」。');break;}if(opts[i].correct)break;dis.add(i);wrong++;wrongFx(null);toast('不對',opts[i].why,'bad');await cooldown(3);}
  addScore(Math.max(10,GM.scoring.final_base-wrong*GM.scoring.wrong_penalty));
  await E.say('gatekeeper','答對了。'+F.explain,{btn:'推開石門'});E.hideDialog();
  st.done=true;st.busy=false;hud();await ending();
}
function arrange(F){const tiles=E.shuffle(st.inv.chars.map((c,i)=>({c,i})));const order=[];
  return new Promise(async res=>{E.actions([]);await E.showLine('gatekeeper',F.arrange_prompt);
    const wrap=document.createElement('div');const draw=()=>{wrap.innerHTML='';const row=document.createElement('div');row.className='slots';
      for(let k=0;k<4;k++){const s=document.createElement('span');s.className='slotc'+(order[k]?' on':'');s.textContent=order[k]?order[k].c:'';row.appendChild(s);}wrap.appendChild(row);
      const ch=document.createElement('div');ch.className='chips';tiles.forEach(t=>{const used=order.includes(t);ch.appendChild(E.btn('chipb big'+(used?' used':''),t.c,()=>{if(used||order.length>=4)return;order.push(t);draw();}));});wrap.appendChild(ch);sub.disabled=order.length<4;};
    const sub=E.btn('next','放入凹槽',()=>res(order.map(t=>t.c).join('')===F.chars_order.join('')));const reset=E.btn('ghost','重新排列',()=>{order.length=0;draw();});
    draw();E.actions([wrap,sub,reset,E.skipBtn(()=>res('skip'))]);});}

/* frame & hud */
function onFrame(dt,t){
  if(st.started&&!st.done){st.elapsed=(performance.now()-st.t0)/1000;timerText();}
  if(CP.onArrive==null&&!st.done){const d=CP.root.position.distanceTo(P.root.position);if(d>1.9){const off=V(...W.npc_layout.companion_follow);CP.target.copy(P.root.position).add(off);CP.target.x=clamp(CP.target.x,-6,6);CP.target.z=clamp(CP.target.z,-4.8,5.1);CP.speed=4;}}
  if(st.started)[MT,RV,GK].forEach(c=>{if(!E.lookFocus)c.lookAt=P.root.position.clone().add(V(0,1.2,0));else c.lookAt=null;});
}
function timerText(){const s=Math.floor(st.elapsed);$('timer').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function addScore(n){st.score=Math.max(0,st.score+n);}
function hud(){$('score').textContent=st.score;$('solved').textContent=Object.keys(st.solved).length+'/4';$('nbCount').textContent=Object.keys(st.examined).length;
  const id=hintCtx();$('assist').disabled=!st.started||st.done;$('help').disabled=!st.started||st.done;
  $('inv').innerHTML=st.inv.chars.map(c=>'<span class="s">'+c+'</span>').join('')+st.inv.items.map(c=>'<span class="s item">'+c+'</span>').join('');
  door.el.textContent='石門 '+st.inv.chars.length+'/4';
  C.units.forEach(u=>{const o=st.objs[u.station.id];o.el.classList.toggle('locked',!st.unlocked[u.unit_id]);});}
let toastT=null;
function toast(title,text,cls){const el=$('toast');el.className=cls||'';const dg=$('dialog');el.style.bottom=dg.hidden?'14px':Math.min(innerHeight-120,dg.offsetHeight+24)+'px';$('toastT').textContent=title;$('toastD').textContent=text||'';el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3800);}

/* flow */
async function ending(){
  E.env.dim=0;E.flash(true);Object.values(E.chars).forEach(c=>E.emote(c,'hop'));
  P.target.set(0,0,-4.6);await E.sleep(1200);
  const s=Math.floor(st.elapsed),tm=Math.floor(s/60)+' 分 '+(s%60)+' 秒';
  const seen={};const traps=st.traps.filter(t=>{if(seen[t.text])return false;seen[t.text]=1;return true;});
  const tr=traps.length?'<p style="margin-top:6px"><b>你被這些誤導線索騙過</b></p><ul class="review">'+traps.map(t=>{const c=C.units.flatMap(u=>u.clues).find(c=>c.id===t.clue);return '<li><b>'+t.text+'</b><p>'+(c?'來源：'+c.text:'')+'</p><p>'+t.why+'</p></li>';}).join('')+'</ul>':'<p>惠子留下的誤導線索，一條都沒有騙到你。</p>';
  E.overlay('<div class="card"><p class="sub" style="margin:0">逃出庫房</p><h2>'+(st.wrongs===0&&st.hintsUsed===0?'逍遙乎寢臥其下':st.wrongs<=3?'浮於江湖':'猶有蓬之心')+'</h2>'+
    '<div class="stats"><div><b>'+tm+'</b>用時</div><div><b>'+st.score+'</b>分數</div><div><b>'+st.wrongs+'</b>答錯</div><div><b>'+st.hintsUsed+'</b>提示</div></div>'+tr+
    '<p style="font-family:var(--serif)">莊子：'+C.debrief+'</p><button class="primary" id="again">再玩一次</button></div>',true);
  await E.waitClick('#again');location.reload();
}
async function main(){
  E.start();
  E.overlay('<div class="title"><div class="v">逍遙遊</div><div class="v a">莊子</div><div class="side"><p>你被鎖在惠子的庫房裡。<br>他說，這裡全是大而無用的東西。</p><button class="primary" id="go">開始</button></div></div>',true);
  $('go').focus();await E.waitClick('#go');
  const d={mentor:'在窗外指點你，每破解一個機關就會解說',companion:'和你一起被困，每個機關可以幫你找一條線索',rival:'把你們鎖起來的人，還在屋裡留下了誤導的字條',gatekeeper:'守著石門，最後會考問你'};
  E.overlay('<div class="card"><h2>庫房裡外</h2><div class="cast">'+slotKeys.map(s=>'<div>'+E.glyph(C.npc_slots[s].character_id)+'<p style="margin:0"><b>'+C.npc_slots[s].display_name+'</b><br><span>'+d[s]+'</span></p></div>').join('')+
    '</div><p class="sub">點擊物件調查，線索會自動記入筆記本。每個機關都要先找齊附近的線索。答錯要等 5 秒才能再試；學伴提示每次扣 3 分。</p><button class="primary" id="go">環顧四周</button></div>',true);
  await E.waitClick('#go');E.clearOverlay();
  st.started=true;const v=view();await E.camTo(v.p,v.l,1.6);
  $('hud').hidden=false;Object.values(st.objs).forEach(o=>o.el.hidden=false);hud();
  st.busy=true;E.emote(RV,'hop');await E.say('rival',C.story.intro_rival);await E.say('mentor',C.story.intro_mentor);E.hideDialog();st.busy=false;
  st.t0=performance.now();
}
main();
})();
</script>
