<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>魚我所欲也：本心之路</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121A24; --panel:rgba(18,26,37,.92); --panel-line:rgba(224,176,75,.38);
  --paper:#F4EBD6; --ink:#16202A; --muted:#B8AD94; --gold:#E0B04B; --gold-deep:#B9862A;
  --jade:#5FB49C; --cinnabar:#D2553F;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0E141C; --panel:rgba(14,20,29,.94); } }
:root[data-theme="dark"]{ --bg:#0E141C; --panel:rgba(14,20,29,.94); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--paper);font-family:var(--sans);-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* HUD */
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.chap{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:8px 14px;display:flex;align-items:baseline;gap:10px;min-width:0}
.chap span{font-size:12px;color:var(--muted);white-space:nowrap}
.chap strong{font-family:var(--serif);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lamp{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:6px 12px 6px 8px;display:flex;align-items:center;gap:8px}
.lamp svg{width:26px;height:34px;flex:none}
.lamp .lab{display:flex;flex-direction:column;gap:4px;min-width:92px}
.lamp .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.lamp .row b{color:var(--paper);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:rgba(244,235,214,.14);overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--gold);transition:width .6s ease,background .6s}
#assist{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--gold);border-radius:999px;padding:6px 12px 6px 8px;font-size:13px}
#assist svg{width:18px;height:18px}
#assist:disabled{opacity:.4;cursor:default;border-color:var(--panel-line)}
#assist.ready{box-shadow:0 0 0 0 rgba(224,176,75,.6)}
@media (prefers-reduced-motion: no-preference){ #assist.ready{animation:ping 1.8s ease-out infinite} @keyframes ping{0%{box-shadow:0 0 0 0 rgba(224,176,75,.55)}80%,100%{box-shadow:0 0 0 10px rgba(224,176,75,0)}} }
#assistBubble{position:absolute;right:12px;top:118px;width:min(320px,calc(100% - 24px));background:var(--paper);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#assistBubble .t{font-size:12px;color:#7A6A45;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
#assistBubble button{background:none;border:0;color:#7A6A45;font-size:12px;padding:0}

/* dialog */
#dialog{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(760px,calc(100% - 20px));max-height:52%;overflow:auto;background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:14px 18px 16px}
.who{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:700;font-size:15px;color:var(--gold);margin-bottom:6px}
.who .dot{width:12px;height:12px;border-radius:50%;flex:none}
#line{margin:0;font-size:17px;line-height:1.75;min-height:1.75em}
#line.quote{font-family:var(--serif);font-weight:500}
#actions{margin-top:12px;display:flex;flex-direction:column;gap:8px}
#actions .next{align-self:flex-end;background:var(--gold);color:var(--ink);border:0;border-radius:10px;padding:9px 20px;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:rgba(244,235,214,.05);border:1px solid rgba(244,235,214,.22);border-radius:10px;padding:11px 14px;font-size:16px;line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--gold);background:rgba(224,176,75,.1)}
.opt .k{font-family:var(--serif);color:var(--gold);flex:none}
.skipbtn{align-self:flex-start;background:none;border:1px dashed rgba(244,235,214,.4);border-radius:10px;padding:6px 12px;font-size:13px;color:#B8AD94}
.opt:disabled{opacity:.45;border-color:rgba(210,85,63,.6);text-decoration:line-through;cursor:default}
.status{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){ .shake{animation:shake .35s} @keyframes shake{25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}} }

/* 3D-anchored labels */
#spots,#bubbles{position:absolute;inset:0;pointer-events:none}
.spot{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;background:var(--panel);border:1px solid var(--gold);color:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.spot.done{border-color:var(--jade);color:var(--jade)}
.bub{position:absolute;transform:translate(-50%,-100%);background:var(--paper);color:var(--ink);border-radius:12px;padding:7px 12px;font-size:14px;max-width:220px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--paper)}

/* overlays */
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#overlay.dim{background:rgba(10,15,22,.7)}
#overlay:empty{display:none}
.card{background:var(--paper);color:var(--ink);border-radius:16px;padding:26px 24px;width:min(560px,100%);max-height:100%;overflow:auto}
.card h2{font-family:var(--serif);font-weight:900;font-size:26px;margin:0 0 6px;letter-spacing:.04em}
.card p{line-height:1.75;margin:0 0 12px}
.card .sub{color:#6F6450;font-size:14px}
.primary{background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:11px 24px;font-weight:600;font-size:16px}
.title{display:flex;align-items:center;gap:28px;color:var(--paper)}
.title .v{writing-mode:vertical-rl;font-family:var(--serif);font-weight:900;font-size:clamp(52px,11vh,96px);letter-spacing:.12em;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.title .v.a{font-size:clamp(18px,2.6vh,24px);font-weight:500;letter-spacing:.4em;color:var(--gold);align-self:flex-start;margin-left:-14px}
.title .side{display:flex;flex-direction:column;gap:18px;max-width:260px}
.title .side p{font-family:var(--serif);font-size:18px;line-height:1.8;margin:0;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.title .side .primary{background:var(--gold);color:var(--ink);align-self:flex-start}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
.role{text-align:left;background:#fff;border:1.5px solid #D9CCAE;border-radius:12px;padding:14px;color:var(--ink)}
.role:hover{border-color:var(--gold-deep)}
.role b{font-family:var(--serif);font-size:19px;display:block;margin-bottom:6px}
.role span{font-size:14px;line-height:1.6;display:block;color:#4C4434}
.role em{font-style:normal;font-size:12px;color:#8A7A55;display:block;margin-top:8px}
.cast{display:flex;flex-direction:column;gap:10px;margin:14px 0 18px}
.cast div{display:flex;align-items:center;gap:12px}
.cast svg{width:34px;height:34px;flex:none}
.cast b{font-family:var(--serif)}
.cast span{font-size:14px;color:#4C4434}
.chapcard{text-align:center;color:var(--paper)}
.chapcard small{font-size:14px;color:var(--gold);letter-spacing:.3em}
.chapcard h2{font-family:var(--serif);font-weight:900;font-size:clamp(34px,6vw,54px);margin:8px 0 14px;letter-spacing:.08em}
.chapcard p{font-family:var(--serif);font-size:17px;line-height:1.8;max-width:30em;margin:0 auto;color:#E9DFC6}
.tl{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:10px}
.tl li{border-left:3px solid #D9CCAE;padding:2px 0 2px 12px}
.tl li.ok{border-color:var(--jade)} .tl li.bad{border-color:var(--cinnabar)} .tl li.mid{border-color:var(--gold-deep)}
.tl b{font-family:var(--serif)} .tl .tag{font-size:12px;margin-left:6px;color:#6F6450}
.tl p{font-size:14px;margin:4px 0 0;color:#4C4434;line-height:1.6}
.stats{display:flex;gap:18px;font-size:14px;color:#6F6450;margin-bottom:6px}
.stats b{font-size:20px;color:var(--ink);font-family:var(--serif);display:block}
@media (max-width:560px){
  .roles{grid-template-columns:1fr}
  #line{font-size:16px}
  .chap strong{font-size:15px}
  .title{gap:18px}
  #assistBubble{top:112px}
}
</style>
</head>

<script type="application/json" id="d-content">{"meta": {"topic": "魚我所欲也", "author": "孟子", "language": "zh-Hant", "audience": "DSE 中文科", "central_thesis": "舍生取義：義比生命更值得追求；羞惡之心人皆有之，賢者能勿喪，追逐萬鍾而不辨禮義便是失其本心。"}, "player_roles": [{"role_id": "hanshi", "display_name": "寒門士子", "blurb": "家貧苦讀，赴京應考。一路上，你會不斷被迫在「生」與「義」之間選擇。", "address": "先生", "start_value": 55}, {"role_id": "youxue", "display_name": "遊學少年", "blurb": "初次離家遊學，見識未深。世間的誘惑，對你來說特別新鮮。", "address": "小兄弟", "start_value": 45}], "npc_slots": {"mentor": {"character_id": "G", "display_name": "孟子", "persona": "從容善辯，愛用比喻", "costume": ["ru_hat"]}, "companion": {"character_id": "O", "display_name": "公孫丑", "persona": "孟子的弟子，好學多問", "costume": []}, "rival": {"character_id": "A", "display_name": "萬鍾先生", "persona": "富甲一方，凡事以利誘人", "costume": ["coin"]}, "gatekeeper": {"character_id": "I", "display_name": "心燈", "persona": "守護本心的燈靈，嚴正而溫和", "costume": ["lantern"]}}, "units": [{"unit_id": "u1", "title": "魚與熊掌", "concept": "以「魚與熊掌不可得兼」類比「生與義不可得兼」，引出舍生取義的中心論點。", "key_quote": "生亦我所欲也，義亦我所欲也；二者不可得兼，舍生而取義者也。", "misconceptions": ["孟子只是在講飲食喜好", "孟子認為生命不重要"], "tags": {"has_dilemma": true, "has_perspectives": false, "has_evidence": false, "bloom": "understand"}, "lines": {"enter": "{address}，市集到了！聽說今天有人在賣熊掌，好稀奇啊。", "guide": "魚，是我想要的；熊掌，也是我想要的。兩者不能同時得到，我會捨棄魚而選取熊掌。你仔細想想，我為甚麼要拿兩樣「都想要」的東西來比較？", "dilemma": "哈！熊掌貴得很，魚又便宜又飽肚。孟夫子說了半天，不就是說他愛吃熊掌嗎？", "prompt": "孟子用魚和熊掌，真正想說的是甚麼？"}, "hotspots": [{"id": "fish", "label": "一籃鮮魚", "text": "鮮魚在市集上隨處可見。攤主說：「魚嘛，人人都想吃。」"}, {"id": "bearpaw", "label": "熊掌", "text": "熊掌極其珍貴，可遇不可求。同樣是想要的東西，它比魚難得得多。"}, {"id": "slip1", "label": "竹簡", "text": "竹簡上寫著：「魚，我所欲也，熊掌，亦我所欲也；二者不可得兼，舍魚而取熊掌者也。生亦我所欲也，義亦我所欲也……」"}], "choices": [{"type": "correct", "text": "這是類比：魚比喻生，熊掌比喻義。兩者都想要，不能兼得時，選取更珍貴的義。", "feedback": "正是如此。我說「生亦我所欲也」，生命我同樣珍惜；只是當生與義不可得兼，義更值得選取。"}, {"type": "misconception", "text": "孟子只是在說他喜歡吃熊掌多於吃魚。", "feedback": "飲食只是比喻。緊接的一句「生亦我所欲也，義亦我所欲也」，句式與前句完全相同，這才是我要說的道理。"}, {"type": "suboptimal", "text": "孟子認為生命不重要，應該隨時捨棄。", "feedback": "方向對了一半，卻說過頭了。我明言「生亦我所欲也」，並不輕視生命，只是在兩者不可得兼時，才舍生取義。"}], "reactions": {"rival_on_correct": "哼……原來是借題發揮，算你聰明。", "rival_on_wrong": "哈哈！我就說嘛，讀書人也是要吃飯的！", "companion_on_correct": "原來魚和熊掌只是開場白！", "companion_on_wrong": "老師好像搖頭了……"}, "gate": {"question": "「舍魚而取熊掌」引出了全文的哪一個中心論點？", "options": ["舍生取義", "安貧樂道", "知足常樂", "先憂後樂"], "answer": 0, "explain": "孟子以魚與熊掌類比生與義，從而提出「舍生而取義」。"}, "hints": {"dilemma": ["想想看：孟子為甚麼偏偏挑兩樣「都想要」的東西來比較？", "竹簡上下一句是「生亦我所欲也，義亦我所欲也」，句式和魚、熊掌那句一模一樣。", "魚對應生，熊掌對應義。這是類比，不是講食物。"], "gate": ["留意「二者不可得兼」之後，孟子選擇了甚麼。", "答案和「生」與「義」的取捨有關。", "孟子說：「舍生而取義者也。」"]}}, {"unit_id": "u2", "title": "所欲有甚於生", "concept": "從反面假設推論：若人最想要的是生命，就會不擇手段求生；但人有時寧死不為，證明有比生更想要的（義），有比死更厭惡的（不義）。", "key_quote": "如使人之所欲莫甚於生，則凡可以得生者，何不用也？", "misconceptions": ["生命最重要，為了活命可以不擇手段", "先用不義手段保命，之後再補救也可以"], "tags": {"has_dilemma": true, "has_perspectives": false, "has_evidence": true, "bloom": "analyze"}, "lines": {"enter": "{address}，天色晚了，我們在這茶亭歇一歇吧……咦，那邊好像有人在等我們？", "guide": "假如人最想要的就是活命，那麼凡是能保命的手段，有甚麼不能用？可是世上偏偏有人寧死也不肯用。可見人想要的，有比生命更重要的東西。這是從反面假設來推論。", "dilemma": "這封信，只要你簽個名，指證你的老師私藏禁書，我保你平安無事。不簽嘛……官府追究起來，同謀之罪，可是要殺頭的。", "prompt": "按孟子的觀點，你會怎樣做？"}, "hotspots": [{"id": "letter", "label": "誣告信", "text": "信中要你作假證，陷害無辜的老師。只要簽名，你就能保命。"}, {"id": "slip2", "label": "竹簡", "text": "竹簡上寫著：「生亦我所欲，所欲有甚於生者，故不為苟得也；死亦我所惡，所惡有甚於死者，故患有所不辟也。」"}, {"id": "tablet", "label": "石碑", "text": "石碑上刻著：「如使人之所欲莫甚於生，則凡可以得生者，何不用也？」"}], "choices": [{"type": "correct", "text": "拒絕簽名。所欲有甚於生，所惡有甚於死，我不會苟且偷生。", "feedback": "好！「所欲有甚於生者，故不為苟得也」。正因為人有比生命更想要的東西，才會有寧死不為的時候。"}, {"type": "misconception", "text": "簽吧！生命最重要，留得青山在，不怕沒柴燒。", "feedback": "若人最想要的只是生存，便會不擇手段。我正是要反駁這種想法：「由是則生而有不用也」。"}, {"type": "suboptimal", "text": "先簽名保命，之後再找機會揭發真相。", "feedback": "聽來機智，但仍是以不義的手段求生，這正是我所說的「苟得」。"}], "reactions": {"rival_on_correct": "不識抬舉！……不過，你的膽量倒教我意外。", "rival_on_wrong": "識時務者為俊傑嘛！來，在這裡簽名。", "companion_on_correct": "我剛才手都在抖，你真了不起！", "companion_on_wrong": "這樣做……老師會被冤枉的啊。"}, "gate": {"question": "「如使人之所欲莫甚於生，則凡可以得生者，何不用也？」用了哪一種論證方法？", "options": ["比喻論證", "假設推論（從反面論證）", "引用論證", "舉例論證"], "answer": 1, "explain": "「如使……則……」先假設生命是人最想要的，再推出不合事實的結果，從反面證明「所欲有甚於生」。"}, "hints": {"dilemma": ["孟子說人「不為苟得」。想想「苟得」是甚麼意思。", "先簽名再補救，用的仍然是不義的手段。", "孟子的答案是：所欲有甚於生，所以寧死也不苟且求生。"], "gate": ["留意句子開頭的「如使」。", "「如使」即「假如」。孟子先假設一個情況，再推論結果。", "這是假設推論，從反面論證。"]}}, {"unit_id": "u3", "title": "人皆有之", "concept": "連路人和乞丐也拒絕無禮的施捨，可見羞惡之心（本心）人皆有之，賢者只是能夠不喪失它。", "key_quote": "非獨賢者有是心也，人皆有之，賢者能勿喪耳。", "misconceptions": ["只有賢者才有羞惡之心", "拒絕施捨是因為食物太少"], "tags": {"has_dilemma": true, "has_perspectives": true, "has_evidence": false, "bloom": "understand"}, "lines": {"enter": "{address}，這條村子鬧饑荒，大家都餓壞了……", "guide": "一簞食、一豆羹，得到就能活，得不到就會死。你留意施捨者給食物時的態度，那才是關鍵。", "dilemma": "喂！餓鬼！拿去吃吧！", "prompt": "萬鍾先生一腳把飯碗踢到地上。按孟子所說，路人和乞丐會怎樣對待這份食物？這說明了甚麼？"}, "hotspots": [{"id": "basket", "label": "一簞食", "text": "一小竹筐飯。在饑荒之中，這就是活命的口糧。"}, {"id": "bowl", "label": "一豆羹", "text": "一碗湯羹。得之則生，弗得則死。"}, {"id": "slip3", "label": "竹簡", "text": "竹簡上寫著：「嘑爾而與之，行道之人弗受；蹴爾而與之，乞人不屑也。」"}], "choices": [{"type": "correct", "text": "他們不會接受。連路人和乞丐都有羞惡之心，可見本心人皆有之。", "feedback": "不錯。「非獨賢者有是心也，人皆有之，賢者能勿喪耳。」"}, {"type": "misconception", "text": "只有賢者才會拒絕，普通人餓了自然會吃。", "feedback": "恰恰相反。我舉路人和乞丐為例，正是要說明這份心「人皆有之」，不是賢者獨有。"}, {"type": "suboptimal", "text": "他們會拒絕，因為食物太少，不值得低頭。", "feedback": "不受的原因不在份量，而在施捨者的無禮：呼喝著給、用腳踢著給。是這種侮辱觸動了羞惡之心。"}], "reactions": {"rival_on_correct": "哼，連乞丐都這麼硬氣？", "rival_on_wrong": "對嘛，人餓了還講甚麼骨氣！", "companion_on_correct": "原來人人心裡都有這份尊嚴。", "companion_on_wrong": "可是……被人這樣踢過來，誰會好受呢？"}, "gate": {"question": "「賢者能勿喪耳」的意思是？", "options": ["只有賢者才有本心", "人人都有本心，賢者只是能夠不喪失它", "賢者能夠不喪命", "賢者能令別人不喪失本心"], "answer": 1, "explain": "上一句說「人皆有之」，可見本心人人皆有；賢者的分別，只在於能夠保存而不喪失。"}, "hints": {"dilemma": ["注意施捨者「嘑爾」「蹴爾」的態度。", "孟子特意選了路人和乞丐，而不是賢者，做例子。", "答案在竹簡之後：「非獨賢者有是心也，人皆有之。」"], "gate": ["「喪」在這裡解作「喪失」。", "看看上一句：「非獨賢者有是心也，人皆有之。」", "賢者的分別，在於能夠不喪失本心。"]}}, {"unit_id": "u4", "title": "失其本心", "concept": "從前寧死不受的，如今卻為宮室之美、妻妾之奉、所識窮乏者得我而接受萬鍾，不辨禮義，這就是失其本心。", "key_quote": "萬鍾則不辯禮義而受之。萬鍾於我何加焉？", "misconceptions": ["為了接濟窮朋友而接受不義之財，情有可原", "只要用途正當，取得的方式不重要"], "tags": {"has_dilemma": true, "has_perspectives": false, "has_evidence": true, "bloom": "evaluate"}, "lines": {"enter": "{address}，好氣派的大宅！萬鍾先生說要在這裡款待我們。", "guide": "從前寧可餓死也不肯接受的，如今卻為了華美的宅第、妻妾的供養、讓窮朋友感激自己，而不辨禮義地接受了。這難道不可以停止嗎？", "dilemma": "先生才學過人！只要你肯替我在官府說幾句話，不問是非，萬鍾俸祿就是你的。有了錢，住大宅、養妻妾，還能接濟你那些窮朋友呢！", "prompt": "按孟子的觀點，你會怎樣回應萬鍾先生？"}, "hotspots": [{"id": "mansion", "label": "大宅", "text": "雕樑畫棟的宅第。孟子稱之為「宮室之美」。"}, {"id": "chest", "label": "珠寶箱", "text": "滿箱珠寶綾羅，足以供養妻妾。孟子稱之為「妻妾之奉」。"}, {"id": "friendletter", "label": "朋友來信", "text": "好友來信：「家中斷糧，盼兄接濟。」若收下萬鍾，便能讓「所識窮乏者得我」。"}], "choices": [{"type": "correct", "text": "拒絕。不辨禮義而接受萬鍾，萬鍾於我何加？這樣做就是失其本心。", "feedback": "說得好。從前「為身死而不受」，今天若為了這些而受，「此之謂失其本心」。"}, {"type": "misconception", "text": "收下吧，用來接濟窮朋友，也算是行善。", "feedback": "我特意點出「所識窮乏者得我」，正是要說明：以幫助朋友為名接受不義之財，仍然是失其本心。"}, {"type": "suboptimal", "text": "收下，但只用來接濟朋友，不建大宅、不養妻妾。", "feedback": "用途再正當，取得的方式不合禮義，本心已經失去了。"}], "reactions": {"rival_on_correct": "萬鍾俸祿都不要？……罷了罷了，你這人真是買不動。", "rival_on_wrong": "爽快！以後我們就是自己人了！", "companion_on_correct": "老師在笑呢！", "companion_on_wrong": "心燈……好像暗下來了。"}, "gate": {"question": "「此之謂失其本心」的「本心」指的是甚麼？", "options": ["求生的本能", "羞惡之心，即辨別禮義、舍生取義之心", "追求富貴的欲望", "對朋友的情義"], "answer": 1, "explain": "本心就是路人、乞丐都有的羞惡之心。為萬鍾而不辨禮義，就是把這份心丟掉了。"}, "hints": {"dilemma": ["孟子說「萬鍾於我何加焉」：萬鍾對我真正增加了甚麼？", "宮室、妻妾、窮朋友，三者都是孟子列舉的「藉口」。", "不辨禮義而受萬鍾，就是失其本心。"], "gate": ["回想第三章：路人和乞丐為甚麼拒絕施捨？", "本心就是那份「人皆有之」的心。", "本心即羞惡之心，能辨別禮義、舍生取義。"]}}], "endings": {"best": {"title": "舍生取義", "text": "心燈長明。你在每一次抉擇中都守住了本心。"}, "normal": {"title": "本心猶存", "text": "你曾經動搖，但本心仍在。賢者與常人的分別，就在於能否不喪失它。"}, "fail": {"title": "失其本心", "text": "心燈幾乎熄滅了。但孟子說，本心人皆有之，只要願意，隨時可以找回來。"}}, "debrief": "人皆有本心。魚與熊掌、所欲有甚於生、嘑爾蹴爾、萬鍾不辨禮義：四個層次，說的都是同一件事。賢者能勿喪耳。"}</script>

let lookFocus=null;
const tv=new THREE.Vector3(),tv2=new THREE.Vector3();
function updateChar(c,dt,t){
  const p=c.root.position;tv.copy(c.target).sub(p);tv.y=0;const dist=tv.length();
  let moving=false;
  if(dist>.04){moving=true;const step=Math.min(dist,c.speed*dt);p.addScaledVector(tv.normalize(),step);}
  const yawT=moving?Math.atan2(tv.x,tv.z):(c.face!=null?c.face:Math.atan2(camera.position.x-p.x,camera.position.z-p.z));
  let dy=yawT-c.root.rotation.y;dy=Math.atan2(Math.sin(dy),Math.cos(dy));c.root.rotation.y+=dy*Math.min(1,dt*8);
  if(moving){c.phase+=dt*11;}else{c.phase+=(Math.round(c.phase/Math.PI)*Math.PI-c.phase)*Math.min(1,dt*10);}
  const sw=Math.sin(c.phase)*(moving?.6:0);c.legs[0].rotation.x=sw;c.legs[1].rotation.x=-sw;
  let by=moving?Math.abs(Math.sin(c.phase))*.06:Math.sin(t*2+c.phase)*.008;
  let sx=1,sy=1,rz=0;
  if(c.talk){const k=Math.sin(t*15)*.045;sy+=k;sx-=k*.6;}
  if(c.emote){c.emoteT+=dt;const e=c.emoteT;
    if(c.emote==='hop'){by+=Math.max(0,Math.sin(e*9))*.35*Math.max(0,1-e/1.1);}
    if(c.emote==='shake'){rz=Math.sin(e*28)*.12*Math.max(0,1-e/.8);}
    if(c.emote==='slump'){sy-=.12*Math.sin(Math.min(1,e/.5)*Math.PI/2)*Math.max(0,1-Math.max(0,e-1.2)/.6);sx+=.06*Math.max(0,1-Math.max(0,e-1.2)/.6);}
    if(c.emoteT>1.9)c.emote=null;}
  c.hip.position.y=.47+by;c.body.scale.set(sx,sy,1);c.body.rotation.z=rz;
  c.blinkAt-=dt;if(c.blinkAt<0){c.blinkT=.14;c.blinkAt=2+Math.random()*3.5;}
  let bl=1;if(c.blinkT>0){c.blinkT-=dt;bl=Math.max(.08,Math.abs(c.blinkT/.07-1));}
  const look=(lookFocus&&lookFocus!==c)?tv2.copy(lookFocus.root.position).add({x:0,y:1.3,z:0}):tv2.copy(camera.position);
  c.root.updateMatrixWorld();const loc=c.body.worldToLocal(look.clone());
  c.eyes.forEach(e=>{e.g.scale.y=bl;const v=new THREE.Vector3(loc.x-e.x,loc.y-e.y,loc.z-.2).normalize();e.p.position.x=v.x*e.r*.42;e.p.position.y=v.y*e.r*.42;});
  if(c.lamp){const b=game.bxShown/100;c.lamp.light.intensity=.25+b*1.9;c.lamp.mat.emissive.setRGB(.25+b*.75,.12+b*.36,.04);c.lamp.g.position.y=1.35+Math.sin(t*1.6)*.06;c.lamp.g.rotation.z=Math.sin(t*1.3)*.08;}
}

const cam={p0:new THREE.Vector3(),p1:new THREE.Vector3(),l0:new THREE.Vector3(),l1:new THREE.Vector3(),look:new THREE.Vector3(),t:1,dur:1,res:null};

function camTo(pos,look,dur){cam.p0.copy(camera.position);cam.l0.copy(cam.look);cam.p1.copy(pos);cam.l1.copy(look);cam.t=0;cam.dur=RM?.01:dur;return new Promise(r=>cam.res=r);}
function updateCam(dt){
  if(cam.t<1){cam.t=Math.min(1,cam.t+dt/cam.dur);const k=cam.t*cam.t*(3-2*cam.t);camera.position.lerpVectors(cam.p0,cam.p1,k);cam.look.lerpVectors(cam.l0,cam.l1,k);if(cam.t>=1&&cam.res){const r=cam.res;cam.res=null;r();}}

  par.cx+=(par.x-par.cx)*Math.min(1,dt*3);par.cy+=(par.y-par.cy)*Math.min(1,dt*3);

  // dilemma
  const rv=chars.rival;rv.target.copy(slotPos(i,'rival')).add(new THREE.Vector3(0,0,1.2));rv.speed=2;
  if(u.unit_id==='u3'){rv.target.set(stagePos[i].x+.1,0,stagePos[i].z-.5);await sleep(700);rv.emote='hop';rv.emoteT=0;kick={t:0};}
  await say('rival',u.lines.dilemma);
  setHint(u.hints.dilemma,GM.scoring.hint_penalty);
  const order=shuffle([0,1,2]);
  const pick=await ask('narrator',u.lines.prompt,order.map(k=>u.choices[k].text));
  const choice=u.choices[order[pick]],rule=ch.beats.choices.find(c=>c.type===choice.type);
  setHint(null);$('assistBubble').hidden=true;
  setBenxin(game.benxin+rule.benxin);addScore(rule.score);
  game.history.push({unit:u,choice});
  const good=choice.type==='correct';env.pulse=1;env.pulseColor.set(good?0xFFD27A:0x2A2440);
  if(good){chars.rival.emote='slump';chars.companion.emote='hop';}else{chars.rival.emote='hop';chars.companion.emote='shake';}
  chars.rival.emoteT=chars.companion.emoteT=0;
  floatBubble('companion',good?u.reactions.companion_on_correct:u.reactions.companion_on_wrong,3600);
  await say('rival',good?u.reactions.rival_on_correct:u.reactions.rival_on_wrong);
  chars.rival.target.copy(slotPos(i,'rival'));
  if(!good){chars.mentor.emote='shake';chars.mentor.emoteT=0;}
  await say('mentor',choice.feedback);
  await gate(i,u);
}
async function gate(i,u){
  const gk=chars.gatekeeper;gk.target.copy(stagePos[i]).add(new THREE.Vector3(0,0,portrait?.6:1));gk.speed=2.2;await sleep(900);
  setHint(u.hints.gate,GM.scoring.hint_penalty);
  const wrong=new Set();const startHints=game.hints;
  for(;;){
    const idx=await ask('gatekeeper',u.gate.question,u.gate.options,wrong,true);
    if(idx===-1){setHint(null);$('assistBubble').hidden=true;game.history[game.history.length-1].gate={wrong:wrong.size,hints:game.hints-startHints};await say('gatekeeper','答案是「'+u.gate.options[u.gate.answer]+'」。'+u.gate.explain,{btn:i<C.units.length-1?'前往下一章':'看結局'});break;}
    if(idx===u.gate.answer){
      const used=game.hints-startHints;const pts=Math.max(GM.scoring.gate_min,GM.scoring.gate_first_try-wrong.size*GM.scoring.gate_wrong_penalty);
      addScore(pts);setHint(null);$('assistBubble').hidden=true;gk.emote='hop';gk.emoteT=0;
      game.history[game.history.length-1].gate={wrong:wrong.size,hints:used};
      await say('gatekeeper','答對了。'+u.gate.explain,{btn:i<C.units.length-1?'前往下一章':'看結局'});break;
    }
    wrong.add(idx);gk.emote='shake';gk.emoteT=0;
    const d=$('dialog');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');
    giveHint(true);
  }
  gk.target.copy(slotPos(i,'gatekeeper'));
}
async function ending(){
  setHint(null);$('dialog').hidden=true;setTalker('');
  const b=game.benxin,tier=GM.endings.find(e=>b>=e.min_benxin).id,E=C.endings[tier];
  env.pulse=1;env.pulseColor.set(tier==='best'?0xFFD27A:0x2A2440);
  if(tier==='best'){Object.values(chars).forEach(c=>{c.emote='hop';c.emoteT=0;});}
  await sleep(900);
  const lab={correct:['守住本心','ok'],misconception:['落入盲點','bad'],suboptimal:['未盡完善','mid']};
  const tl=game.history.map((h,i)=>{const [t,cls]=lab[h.choice.type];const right=h.unit.choices.find(c=>c.type==='correct');
    return '<li class="'+cls+'"><b>第'+NUM[i]+'章 '+h.unit.title+'</b><span class="tag">'+t+(h.gate&&(h.gate.wrong||h.gate.hints)?'，考問答錯 '+h.gate.wrong+' 次、提示 '+h.gate.hints+' 次':'')+'</span>'+
    (h.choice.type==='correct'?'<p>你的選擇：'+h.choice.text+'</p>':'<p>你的選擇：'+h.choice.text+'</p><p>孟子的看法：'+right.text+'</p>')+'</li>';}).join('');
  overlay('<div class="card"><p class="sub" style="margin:0">結局</p><h2>'+E.title+'</h2><p>'+E.text+'</p>'+
    '<div class="stats"><div><b>'+Math.round(b)+'</b>本心</div><div><b>'+game.score+'</b>分數</div><div><b>'+game.hints+'</b>提示次數</div></div>'+
    '<ol class="tl">'+tl+'</ol><p style="font-family:var(--serif)">孟子：'+C.debrief+'</p><button class="primary" id="again">再玩一次</button></div>',true);
  await waitClick('#again');location.reload();
}

async function main(){
  resize();setBenxin(50);placeParty(0,true);chars.rival.root.position.x+=0;
  camera.position.set(0,4.2,10);cam.look.set(0,1,-1.2);
  requestAnimationFrame(frame);
  await titleScreen();
  game.role=await chooseRole();
  await castScreen();clearOverlay();
  game.benxin=game.bxShown=game.role.start_value;setBenxin(game.role.start_value);
  $('hud').hidden=false;
  for(let i=0;i<C.units.length;i++)await playChapter(i);
  await ending();
}
main();
})();
</script>
