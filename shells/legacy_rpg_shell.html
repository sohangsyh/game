<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>魚我所欲也：本心之路</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121A24; --panel:rgba(18,26,37,.92); --panel-line:rgba(224,176,75,.38);
  --paper:#F4EBD6; --ink:#16202A; --muted:#B8AD94; --gold:#E0B04B; --gold-deep:#B9862A;
  --jade:#5FB49C; --cinnabar:#D2553F;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0E141C; --panel:rgba(14,20,29,.94); } }
:root[data-theme="dark"]{ --bg:#0E141C; --panel:rgba(14,20,29,.94); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--paper);font-family:var(--sans);-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* HUD */
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.chap{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:8px 14px;display:flex;align-items:baseline;gap:10px;min-width:0}
.chap span{font-size:12px;color:var(--muted);white-space:nowrap}
.chap strong{font-family:var(--serif);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lamp{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:6px 12px 6px 8px;display:flex;align-items:center;gap:8px}
.lamp svg{width:26px;height:34px;flex:none}
.lamp .lab{display:flex;flex-direction:column;gap:4px;min-width:92px}
.lamp .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.lamp .row b{color:var(--paper);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:rgba(244,235,214,.14);overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--gold);transition:width .6s ease,background .6s}
#assist{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--gold);border-radius:999px;padding:6px 12px 6px 8px;font-size:13px}
#assist svg{width:18px;height:18px}
#assist:disabled{opacity:.4;cursor:default;border-color:var(--panel-line)}
#assist.ready{box-shadow:0 0 0 0 rgba(224,176,75,.6)}
@media (prefers-reduced-motion: no-preference){ #assist.ready{animation:ping 1.8s ease-out infinite} @keyframes ping{0%{box-shadow:0 0 0 0 rgba(224,176,75,.55)}80%,100%{box-shadow:0 0 0 10px rgba(224,176,75,0)}} }
#assistBubble{position:absolute;right:12px;top:118px;width:min(320px,calc(100% - 24px));background:var(--paper);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#assistBubble .t{font-size:12px;color:#7A6A45;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
#assistBubble button{background:none;border:0;color:#7A6A45;font-size:12px;padding:0}

/* dialog */
#dialog{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(760px,calc(100% - 20px));max-height:52%;overflow:auto;background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:14px 18px 16px}
.who{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:700;font-size:15px;color:var(--gold);margin-bottom:6px}
.who .dot{width:12px;height:12px;border-radius:50%;flex:none}
#line{margin:0;font-size:17px;line-height:1.75;min-height:1.75em}
#line.quote{font-family:var(--serif);font-weight:500}
#actions{margin-top:12px;display:flex;flex-direction:column;gap:8px}
#actions .next{align-self:flex-end;background:var(--gold);color:var(--ink);border:0;border-radius:10px;padding:9px 20px;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:rgba(244,235,214,.05);border:1px solid rgba(244,235,214,.22);border-radius:10px;padding:11px 14px;font-size:16px;line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--gold);background:rgba(224,176,75,.1)}
.opt .k{font-family:var(--serif);color:var(--gold);flex:none}
.skipbtn{align-self:flex-start;background:none;border:1px dashed rgba(244,235,214,.4);border-radius:10px;padding:6px 12px;font-size:13px;color:#B8AD94}
.opt:disabled{opacity:.45;border-color:rgba(210,85,63,.6);text-decoration:line-through;cursor:default}
.status{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){ .shake{animation:shake .35s} @keyframes shake{25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}} }

/* 3D-anchored labels */
#spots,#bubbles{position:absolute;inset:0;pointer-events:none}
.spot{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;background:var(--panel);border:1px solid var(--gold);color:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.spot.done{border-color:var(--jade);color:var(--jade)}
.bub{position:absolute;transform:translate(-50%,-100%);background:var(--paper);color:var(--ink);border-radius:12px;padding:7px 12px;font-size:14px;max-width:220px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--paper)}

/* overlays */
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#overlay.dim{background:rgba(10,15,22,.7)}
#overlay:empty{display:none}
.card{background:var(--paper);color:var(--ink);border-radius:16px;padding:26px 24px;width:min(560px,100%);max-height:100%;overflow:auto}
.card h2{font-family:var(--serif);font-weight:900;font-size:26px;margin:0 0 6px;letter-spacing:.04em}
.card p{line-height:1.75;margin:0 0 12px}
.card .sub{color:#6F6450;font-size:14px}
.primary{background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:11px 24px;font-weight:600;font-size:16px}
.title{display:flex;align-items:center;gap:28px;color:var(--paper)}
.title .v{writing-mode:vertical-rl;font-family:var(--serif);font-weight:900;font-size:clamp(52px,11vh,96px);letter-spacing:.12em;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.title .v.a{font-size:clamp(18px,2.6vh,24px);font-weight:500;letter-spacing:.4em;color:var(--gold);align-self:flex-start;margin-left:-14px}
.title .side{display:flex;flex-direction:column;gap:18px;max-width:260px}
.title .side p{font-family:var(--serif);font-size:18px;line-height:1.8;margin:0;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.title .side .primary{background:var(--gold);color:var(--ink);align-self:flex-start}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
.role{text-align:left;background:#fff;border:1.5px solid #D9CCAE;border-radius:12px;padding:14px;color:var(--ink)}
.role:hover{border-color:var(--gold-deep)}
.role b{font-family:var(--serif);font-size:19px;display:block;margin-bottom:6px}
.role span{font-size:14px;line-height:1.6;display:block;color:#4C4434}
.role em{font-style:normal;font-size:12px;color:#8A7A55;display:block;margin-top:8px}
.cast{display:flex;flex-direction:column;gap:10px;margin:14px 0 18px}
.cast div{display:flex;align-items:center;gap:12px}
.cast svg{width:34px;height:34px;flex:none}
.cast b{font-family:var(--serif)}
.cast span{font-size:14px;color:#4C4434}
.chapcard{text-align:center;color:var(--paper)}
.chapcard small{font-size:14px;color:var(--gold);letter-spacing:.3em}
.chapcard h2{font-family:var(--serif);font-weight:900;font-size:clamp(34px,6vw,54px);margin:8px 0 14px;letter-spacing:.08em}
.chapcard p{font-family:var(--serif);font-size:17px;line-height:1.8;max-width:30em;margin:0 auto;color:#E9DFC6}
.tl{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:10px}
.tl li{border-left:3px solid #D9CCAE;padding:2px 0 2px 12px}
.tl li.ok{border-color:var(--jade)} .tl li.bad{border-color:var(--cinnabar)} .tl li.mid{border-color:var(--gold-deep)}
.tl b{font-family:var(--serif)} .tl .tag{font-size:12px;margin-left:6px;color:#6F6450}
.tl p{font-size:14px;margin:4px 0 0;color:#4C4434;line-height:1.6}
.stats{display:flex;gap:18px;font-size:14px;color:#6F6450;margin-bottom:6px}
.stats b{font-size:20px;color:var(--ink);font-family:var(--serif);display:block}
@media (max-width:560px){
  .roles{grid-template-columns:1fr}
  #line{font-size:16px}
  .chap strong{font-size:15px}
  .title{gap:18px}
  #assistBubble{top:112px}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="3D 遊戲場景"></canvas>
  <div id="spots"></div>
  <div id="bubbles"></div>
  <header id="hud" hidden>
    <div class="chap"><span id="chapNo"></span><strong id="chapTitle"></strong></div>
    <div class="meters">
      <div class="lamp" aria-label="本心值">
        <svg viewBox="0 0 40 52" aria-hidden="true">
          <rect x="15" y="1" width="10" height="5" rx="1" fill="#B9862A"/>
          <rect x="9" y="6" width="22" height="4" rx="2" fill="#E0B04B"/>
          <ellipse cx="20" cy="27" rx="15" ry="17" fill="#7A2A20"/>
          <ellipse id="lampGlow" cx="20" cy="27" rx="15" ry="17" fill="#FFB347" opacity=".5"/>
          <path d="M20 10v34M11 15c-3 7-3 17 0 24M29 15c3 7 3 17 0 24" stroke="#5A1D16" stroke-width="1.2" fill="none" opacity=".55"/>
          <rect x="9" y="43" width="22" height="4" rx="2" fill="#E0B04B"/>
          <path d="M20 47v4" stroke="#C8452F" stroke-width="2"/>
        </svg>
        <div class="lab">
          <div class="row"><span>本心</span><b id="bxVal">50</b></div>
          <div class="bar"><i id="bxBar"></i></div>
          <div class="row"><span>分數</span><b id="scoreVal">0</b></div>
        </div>
      </div>
      <button id="assist" disabled aria-label="向學伴求助">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E0B04B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>
        <span id="assistLabel">學伴</span>
      </button>
    </div>
  </header>
  <div id="assistBubble" hidden role="status"></div>
  <section id="dialog" hidden aria-live="polite">
    <div class="who"><i class="dot" id="whoDot"></i><span id="whoName"></span></div>
    <p id="line"></p>
    <div id="actions"></div>
  </section>
  <div id="overlay"></div>
</div>

<script type="application/json" id="d-content">%%CONTENT%%</script>
<script type="application/json" id="d-world">%%WORLD%%</script>
<script type="application/json" id="d-game">%%GAME%%</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const C=JSON.parse(document.getElementById('d-content').textContent);
const W=JSON.parse(document.getElementById('d-world').textContent);
const GM=JSON.parse(document.getElementById('d-game').textContent);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const NUM=['一','二','三','四','五','六'];

/* ---------- renderer ---------- */
const canvas=$('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(46,1,0.1,500);
let portrait=false;
function resize(){
  const w=canvas.clientWidth||innerWidth,h=canvas.clientHeight||innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  camera.fov=camera.aspect<0.85?54:46;camera.updateProjectionMatrix();const p=camera.aspect<0.85; if(p!==portrait){portrait=p; if(game.stage>=0) placeParty(game.stage,true);}
}
addEventListener('resize',resize);

const gm=new THREE.DataTexture(new Uint8Array([92,165,232]),3,1,THREE.LuminanceFormat);
gm.minFilter=gm.magFilter=THREE.NearestFilter;gm.generateMipmaps=false;gm.needsUpdate=true;
const mats={};
function M(hex,o){const k=hex+(o?JSON.stringify(o):'');if(!mats[k])mats[k]=new THREE.MeshToonMaterial(Object.assign({color:hex,gradientMap:gm},o||{}));return mats[k];}
function mesh(geo,mat,x,y,z,parent){const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);if(parent)parent.add(m);return m;}
function box(w,h,d,c,x,y,z,p){return mesh(new THREE.BoxGeometry(w,h,d),M(c),x,y,z,p);}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- lights & env ---------- */
const hemi=new THREE.HemisphereLight(0xffffff,0x556644,.9);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.9);sun.position.set(12,22,10);scene.add(sun);
scene.fog=new THREE.Fog(0xBFDDE8,40,170);
scene.background=new THREE.Color(0xBFDDE8);
const ENV={
  morning:{sky:0xB9D6E2,hs:0xF4ECDC,hg:0x5C6E4C,hi:.72,sc:0xFFE2B0,si:.75,sp:[12,22,10]},
  dusk:{sky:0xE6B08A,hs:0xFFD2A8,hg:0x6A5A4A,hi:.78,sc:0xFF9E5E,si:.9,sp:[-18,9,6]},
  overcast:{sky:0xA7B0AE,hs:0xD9DED9,hg:0x5E6658,hi:.85,sc:0xDDE3E0,si:.45,sp:[4,20,6]},
  night:{sky:0x1D2A44,hs:0x8EA2CC,hg:0x2B2E3A,hi:.55,sc:0xA9BCEB,si:.38,sp:[-8,18,-6]}
};
const env={cur:{},tgt:null,pulse:0,pulseColor:new THREE.Color(0xFFD27A)};
['sky','hs','hg','sc'].forEach(k=>env.cur[k]=new THREE.Color());
function setEnv(name,instant){const e=ENV[name];env.tgt=e;if(instant){env.cur.sky.set(e.sky);env.cur.hs.set(e.hs);env.cur.hg.set(e.hg);env.cur.sc.set(e.sc);env.cur.hi=e.hi;env.cur.si=e.si;}}
setEnv('morning',true);
const dimColor=new THREE.Color(0x4E4A58),tmpC=new THREE.Color(),sunT=new THREE.Vector3();
function updateEnv(dt){
  const e=env.tgt,k=Math.min(1,dt*1.4);
  env.cur.sky.lerp(tmpC.set(e.sky),k);env.cur.hs.lerp(tmpC.set(e.hs),k);env.cur.hg.lerp(tmpC.set(e.hg),k);env.cur.sc.lerp(tmpC.set(e.sc),k);
  env.cur.hi+= (e.hi-env.cur.hi)*k; env.cur.si+=(e.si-env.cur.si)*k;
  sunT.set(e.sp[0],e.sp[1],e.sp[2]);sun.position.lerp(sunT,k);
  const dim=(1-game.bxShown/100)*.38;
  const sky=env.cur.sky.clone().lerp(dimColor,dim);
  env.pulse*=Math.pow(.25,dt);
  if(env.pulse>0.01) sky.lerp(env.pulseColor,env.pulse*.35);
  scene.background.copy(sky);scene.fog.color.copy(sky);
  hemi.color.copy(env.cur.hs);hemi.groundColor.copy(env.cur.hg);hemi.intensity=env.cur.hi*(1-dim*.5)+env.pulse*.25;
  sun.color.copy(env.cur.sc);sun.intensity=env.cur.si*(1-dim*.6);
}

/* ---------- world ---------- */
const stagePos=W.stages.map(s=>new THREE.Vector3(...s.position));
const ground=mesh(new THREE.PlaneGeometry(420,420),M(0x7FA35C),0,0,-33,scene);ground.rotation.x=-Math.PI/2;
// plazas and paths
stagePos.forEach(p=>{const pl=mesh(new THREE.CircleGeometry(6.5,28),M(0xC9B88F),p.x,.015,p.z-1,scene);pl.rotation.x=-Math.PI/2;});
for(let i=0;i<stagePos.length;i++){
  const a=i===0?new THREE.Vector3(0,0,14):stagePos[i-1],b=stagePos[i];
  const d=b.clone().sub(a),len=d.length();
  const seg=mesh(new THREE.PlaneGeometry(2.6,len),M(0xCDBB98),(a.x+b.x)/2,.012,(a.z+b.z)/2,scene);
  seg.rotation.x=-Math.PI/2;seg.rotation.z=Math.atan2(d.x,d.z)*-1;seg.rotation.order='YXZ';
  seg.rotation.set(-Math.PI/2,0,0);const g=new THREE.Group();g.position.copy(seg.position);g.rotation.y=Math.atan2(d.x,d.z);scene.add(g);seg.position.set(0,0,0);g.add(seg);
}
function nearPath(x,z){
  for(let i=0;i<stagePos.length;i++){const p=stagePos[i];if(Math.hypot(x-p.x,z-(p.z-1))<9.5)return true;
    const a=i===0?{x:0,z:14}:stagePos[i-1],b=p;const dx=b.x-a.x,dz=b.z-a.z,L=dx*dx+dz*dz;let t=((x-a.x)*dx+(z-a.z)*dz)/L;t=Math.max(0,Math.min(1,t));
    if(Math.hypot(x-(a.x+t*dx),z-(a.z+t*dz))<3.4)return true;}
  return false;
}
function tree(x,z,s,kind,r){
  const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g);
  mesh(new THREE.CylinderGeometry(.13,.18,1.1,6),M(0x7A5236),0,.55,0,g);
  if(kind){mesh(new THREE.ConeGeometry(.9,1.5,7),M(0x3E6B4E,{flatShading:true}),0,1.5,0,g);mesh(new THREE.ConeGeometry(.65,1.2,7),M(0x4A7C59,{flatShading:true}),0,2.2,0,g);}
  else{const c=[0x6FA35A,0x7DB062,0x5E9450][Math.floor(r()*3)];mesh(new THREE.IcosahedronGeometry(.95,0),M(c,{flatShading:true}),0,1.75,0,g);}
}
(function(){const r=rng(7);let n=0;while(n<95){const x=-70+r()*130,z=-110+r()*135;if(nearPath(x,z))continue;tree(x,z,.8+r()*.9,r()<.35,r);n++;}})();
(function(){const r=rng(3);for(let i=0;i<22;i++){const a=i/22*Math.PI*2,d=105+r()*35;const h=18+r()*26;
  const m=mesh(new THREE.ConeGeometry(14+r()*12,h,5),M(r()<.5?0x7C98A0:0x8FA7A0,{flatShading:true}),Math.cos(a)*d,h/2-1,-35+Math.sin(a)*d,scene);m.rotation.y=r()*3;}})();
function roofGeo(){const g=new THREE.ConeGeometry(1,1,4);g.rotateY(Math.PI/4);return g;}
const RG=roofGeo();
function house(parent,x,z,w,d,h,wall,roof,ry){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry||0;parent.add(g);
  box(w,h,d,wall,0,h/2,0,g);box(w+.12,.18,d+.12,0x6E4A32,0,h+.05,0,g);
  const rf=mesh(RG,M(roof),0,h+.62,0,g);rf.scale.set((w/2+.45)/.707,1.15,(d/2+.45)/.707);
  box(.7,1.3,.06,0x3B2A22,0,.65,d/2+.03,g);return g;
}
function lanternProp(parent,x,y,z){const g=new THREE.Group();g.position.set(x,y,z);parent.add(g);
  const b=mesh(new THREE.SphereGeometry(.5,12,10),M(0xC8452F,{emissive:0x7A1E10}),0,0,0,g);b.scale.set(.28,.34,.28);
  mesh(new THREE.CylinderGeometry(.09,.09,.06,8),M(0xE0B04B),0,.19,0,g);mesh(new THREE.CylinderGeometry(.09,.09,.06,8),M(0xE0B04B),0,-.19,0,g);lanterns.push(b);return g;}
const lanterns=[];
const locGroups=stagePos.map(p=>{const g=new THREE.Group();g.position.copy(p);scene.add(g);return g;});
const props={};
// L1 market

let lookFocus=null;
const tv=new THREE.Vector3(),tv2=new THREE.Vector3();
function updateChar(c,dt,t){
  const p=c.root.position;tv.copy(c.target).sub(p);tv.y=0;const dist=tv.length();
  let moving=false;
  if(dist>.04){moving=true;const step=Math.min(dist,c.speed*dt);p.addScaledVector(tv.normalize(),step);}
  const yawT=moving?Math.atan2(tv.x,tv.z):(c.face!=null?c.face:Math.atan2(camera.position.x-p.x,camera.position.z-p.z));
  let dy=yawT-c.root.rotation.y;dy=Math.atan2(Math.sin(dy),Math.cos(dy));c.root.rotation.y+=dy*Math.min(1,dt*8);
  if(moving){c.phase+=dt*11;}else{c.phase+=(Math.round(c.phase/Math.PI)*Math.PI-c.phase)*Math.min(1,dt*10);}
  const sw=Math.sin(c.phase)*(moving?.6:0);c.legs[0].rotation.x=sw;c.legs[1].rotation.x=-sw;
  let by=moving?Math.abs(Math.sin(c.phase))*.06:Math.sin(t*2+c.phase)*.008;
  let sx=1,sy=1,rz=0;
  if(c.talk){const k=Math.sin(t*15)*.045;sy+=k;sx-=k*.6;}
  if(c.emote){c.emoteT+=dt;const e=c.emoteT;
    if(c.emote==='hop'){by+=Math.max(0,Math.sin(e*9))*.35*Math.max(0,1-e/1.1);}
    if(c.emote==='shake'){rz=Math.sin(e*28)*.12*Math.max(0,1-e/.8);}
    if(c.emote==='slump'){sy-=.12*Math.sin(Math.min(1,e/.5)*Math.PI/2)*Math.max(0,1-Math.max(0,e-1.2)/.6);sx+=.06*Math.max(0,1-Math.max(0,e-1.2)/.6);}
    if(c.emoteT>1.9)c.emote=null;}
  c.hip.position.y=.47+by;c.body.scale.set(sx,sy,1);c.body.rotation.z=rz;
  c.blinkAt-=dt;if(c.blinkAt<0){c.blinkT=.14;c.blinkAt=2+Math.random()*3.5;}
  let bl=1;if(c.blinkT>0){c.blinkT-=dt;bl=Math.max(.08,Math.abs(c.blinkT/.07-1));}
  const look=(lookFocus&&lookFocus!==c)?tv2.copy(lookFocus.root.position).add({x:0,y:1.3,z:0}):tv2.copy(camera.position);
  c.root.updateMatrixWorld();const loc=c.body.worldToLocal(look.clone());
  c.eyes.forEach(e=>{e.g.scale.y=bl;const v=new THREE.Vector3(loc.x-e.x,loc.y-e.y,loc.z-.2).normalize();e.p.position.x=v.x*e.r*.42;e.p.position.y=v.y*e.r*.42;});
  if(c.lamp){const b=game.bxShown/100;c.lamp.light.intensity=.25+b*1.9;c.lamp.mat.emissive.setRGB(.25+b*.75,.12+b*.36,.04);c.lamp.g.position.y=1.35+Math.sin(t*1.6)*.06;c.lamp.g.rotation.z=Math.sin(t*1.3)*.08;}
}

const cam={p0:new THREE.Vector3(),p1:new THREE.Vector3(),l0:new THREE.Vector3(),l1:new THREE.Vector3(),look:new THREE.Vector3(),t:1,dur:1,res:null};
const par={x:0,y:0,cx:0,cy:0};
addEventListener('pointermove',e=>{par.x=(e.clientX/innerWidth-.5);par.y=(e.clientY/innerHeight-.5);});
function stageView(i){const p=stagePos[i];const d=portrait?15:10.5;const h=portrait?4.8:3.7;
  return {pos:new THREE.Vector3(p.x,h,p.z+d),look:new THREE.Vector3(p.x,portrait?-.35:.55,p.z-1.6)};}
function camTo(pos,look,dur){cam.p0.copy(camera.position);cam.l0.copy(cam.look);cam.p1.copy(pos);cam.l1.copy(look);cam.t=0;cam.dur=RM?.01:dur;return new Promise(r=>cam.res=r);}
function updateCam(dt){
  if(cam.t<1){cam.t=Math.min(1,cam.t+dt/cam.dur);const k=cam.t*cam.t*(3-2*cam.t);camera.position.lerpVectors(cam.p0,cam.p1,k);cam.look.lerpVectors(cam.l0,cam.l1,k);if(cam.t>=1&&cam.res){const r=cam.res;cam.res=null;r();}}
  else if(game.stage<0){const t=clock.elapsedTime*.06;camera.position.set(Math.sin(t)*11,4.2,Math.cos(t)*11-1);cam.look.set(0,1,-1.2);}
  par.cx+=(par.x-par.cx)*Math.min(1,dt*3);par.cy+=(par.y-par.cy)*Math.min(1,dt*3);
  camera.lookAt(cam.look.x+(RM?0:par.cx*.6),cam.look.y-(RM?0:par.cy*.3),cam.look.z);
}

const clock=new THREE.Clock();
function frame(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  game.bxShown+=(game.benxin-game.bxShown)*Math.min(1,dt*2.5);
  updateEnv(dt);updateCam(dt);
  Object.values(chars).forEach(c=>updateChar(c,dt,t));
  hotspots.forEach(h=>{if(h.ring.visible){h.ring.rotation.y+=dt*2;h.ring.position.y=h.anchor.y-.3+Math.sin(t*3+h.anchor.x)*.06;}
    if(!h.el.hidden)project(h.anchor,h.el);});
  bubbles.forEach(b=>{project(tv.copy(b.c.root.position).add({x:0,y:2.35,z:0}),b.el);});
  lanterns.forEach(l=>{l.material.emissive.setHex(env.tgt===ENV.night?0xD8501E:0x7A1E10);});
  if(kick){kick.t+=dt;const k=Math.min(1,kick.t/.35);props.bowl.rotation.z=-1.45*k;props.bowl.position.x=.6+1.2*k;props.bowl.position.z=-.4+.6*k;}

function setTalker(key){Object.values(chars).forEach(c=>c.talk=false);lookFocus=null;if(chars[key]){chars[key].talk=true;lookFocus=chars[key];}}
function showLine(key,text,quote){
  const d=$('dialog');d.hidden=false;$('whoName').textContent=SPK[key].name;$('whoDot').style.background=SPK[key].col;
  const line=$('line');line.classList.toggle('quote',!!quote);setTalker(key);

  if(RM){line.textContent=text;return Promise.resolve();}
  line.textContent='';let i=0;
  return new Promise(res=>{typing={id:setInterval(()=>{i+=1;line.textContent=text.slice(0,i);if(i>=text.length){clearInterval(typing.id);typing=null;if(chars[key])chars[key].talk=false;res();}},26),finish:()=>{clearInterval(typing.id);typing=null;line.textContent=text;if(chars[key])chars[key].talk=false;res();}};});
}

  return new Promise(res=>{const b=btn('next',opt.btn||'繼續',()=>res());actions([b]);b.focus({preventScroll:true});});}
async function ask(key,text,options,disabled,skip){actions([]);await showLine(key,text);if(chars[key])chars[key].talk=false;
  return new Promise(res=>{const n=options.map((o,i)=>{const b=btn('opt','<span class="k">'+'甲乙丙丁'[i]+'</span><span>'+o+'</span>',()=>res(i));if(disabled&&disabled.has(i))b.disabled=true;return b;});if(skip)n.push(btn('skipbtn','跳過，看答案',()=>res(-1)));actions(n);});}
function fill(s){return s.replace(/\{address\}/g,game.role?game.role.address:'');}

/* ---------- assistant ---------- */
function setHint(list,penalty){game.hint=list?{list,level:0,penalty}:null;const a=$('assist');a.disabled=!list;a.classList.toggle('ready',!!list);$('assistLabel').textContent=list?'學伴提示':'學伴';}
function bubble(title,text){const b=$('assistBubble');b.innerHTML='';const t=document.createElement('div');t.className='t';const s=document.createElement('span');s.textContent=title;
  const x=document.createElement('button');x.textContent='收起';x.onclick=()=>b.hidden=true;t.append(s,x);const p=document.createElement('div');p.textContent=text;b.append(t,p);b.hidden=false;}
function giveHint(auto){const h=game.hint;if(!h)return;if(h.level>=h.list.length){bubble('學伴','提示已經用完了，相信自己的判斷吧！');return;}
  const txt=h.list[h.level];h.level++;if(!auto){game.hints++;addScore(-h.penalty);}
  bubble('學伴提示 '+h.level+'/'+h.list.length+(auto?'':'（扣 '+h.penalty+' 分）'),txt);
  if(h.level>=h.list.length)$('assist').classList.remove('ready');}
$('assist').addEventListener('click',()=>giveHint(false));

/* ---------- overlay ---------- */
function overlay(html,dim){const o=$('overlay');o.className=dim?'dim':'';o.innerHTML=html;return o;}
function clearOverlay(){const o=$('overlay');o.innerHTML='';o.className='';}
function glyph(id){const [c]=PAL[id];const col='#'+c.toString(16).padStart(6,'0');const eye='<circle cx="CX" cy="CY" r="4.2" fill="#fff"/><circle cx="CX" cy="CY" r="2.3" fill="#0B1F5E"/>';
  const e=(pts)=>pts.map(([x,y])=>eye.replace(/CX/g,x).replace(/CY/g,y)).join('');
  const sh={A:'<path d="M17 3 L31 27 H3 Z" fill="'+col+'" stroke="'+col+'" stroke-width="2" stroke-linejoin="round"/>'+e([[13,19],[21,19]]),
    I:'<rect x="11" y="2" width="12" height="27" rx="2" fill="'+col+'"/>'+e([[13,11],[21,11]]),
    G:'<path d="M26 9 A11 11 0 1 0 26 25" stroke="'+col+'" stroke-width="6" fill="none"/><path d="M20 17 L29 17 L29 26" stroke="'+col+'" stroke-width="4" fill="none"/>'+e([[12,7],[19,7]]),
    O:'<circle cx="17" cy="17" r="10" stroke="'+col+'" stroke-width="6" fill="none"/>'+e([[10,8],[17,6]])}[id];
  return '<svg viewBox="0 0 34 34" aria-hidden="true">'+sh+'</svg>';}
function waitClick(sel){return new Promise(r=>document.querySelectorAll(sel).forEach(b=>b.addEventListener('click',()=>r(b))));}

/* ---------- flow ---------- */
async function titleScreen(){
  overlay('<div class="title"><div class="v">魚我所欲也</div><div class="v a">孟子</div><div class="side"><p>生，亦我所欲也；<br>義，亦我所欲也。<br>二者不可得兼……</p><button class="primary" id="go">開始</button></div></div>',true);
  $('go').focus();await waitClick('#go');
}
async function chooseRole(){
  overlay('<div class="card"><h2>你是誰？</h2><p class="sub">選擇你的身份。不同身份的起始本心不同，旁人對你的稱呼也不同。</p><div class="roles">'+
    C.player_roles.map((r,i)=>'<button class="role" data-i="'+i+'"><b>'+r.display_name+'</b><span>'+r.blurb+'</span><em>起始本心 '+r.start_value+'</em></button>').join('')+'</div></div>',true);
  const b=await waitClick('.role');return C.player_roles[+b.dataset.i];
}
async function castScreen(){
  const desc={mentor:'你的老師，會為你點破道理',companion:'孟子的弟子，和你一起上路',rival:'處處以利誘人，考驗你的本心',gatekeeper:'守護本心的燈靈，每章結束時考問你'};
  overlay('<div class="card"><h2>同行的人</h2><div class="cast">'+Object.entries(C.npc_slots).map(([s,d])=>'<div>'+glyph(d.character_id)+'<p style="margin:0"><b>'+d.display_name+'</b><br><span>'+desc[s]+'</span></p></div>').join('')+
    '</div><p class="sub">右上角的燈是你的「本心」。每個選擇都會讓它變亮或變暗。卡住時，可以按「學伴提示」，但每次會扣 2 分。</p><button class="primary" id="go">出發</button></div>',true);
  await waitClick('#go');
}
async function chapterCard(i,u){
  overlay('<div class="chapcard"><small>第'+NUM[i]+'章</small><h2>'+u.title+'</h2><p>'+u.key_quote+'</p></div>',true);
  await Promise.race([sleep(RM?1200:2600),new Promise(r=>$('overlay').addEventListener('click',r,{once:true}))]);clearOverlay();
}
function explore(si){
  const list=hotspots.filter(h=>h.si===si);let idle;
  const status=()=>{const n=list.filter(h=>h.done).length;$('whoName').textContent='調查';$('whoDot').style.background='#F2C14E';
    $('line').classList.remove('quote');$('line').textContent=n<list.length?'四處看看：點擊場景中發亮的地方調查線索（'+n+'/'+list.length+'）':'線索都調查過了。';};
  return new Promise(res=>{
    const arm=()=>{clearTimeout(idle);idle=setTimeout(()=>bubble('學伴','試試點擊金色圓環，或畫面上的標籤。'),GM.chapters[si].beats.explore.idle_hint_sec*1000);};
    list.forEach(h=>{h.ring.visible=true;h.el.hidden=false;});
    const back=()=>{status();const n=list.filter(h=>h.done).length;
      if(n>=list.length){clearTimeout(idle);actions([btn('next','繼續',()=>{list.forEach(h=>{h.ring.visible=false;h.el.hidden=true;});exploreCb=null;res();})]);}else{actions([]);arm();}};
    exploreCb=async h=>{if(h.si!==si)return;clearTimeout(idle);$('assistBubble').hidden=true;h.done=true;h.el.classList.add('done');h.ring.material=new THREE.MeshBasicMaterial({color:0x5FB49C});
      const q=/「/.test(h.data.text);actions([]);await showLine('clue',h.data.text,q);$('whoName').textContent=h.data.label;actions([btn('next','收起',back)]);};
    $('dialog').hidden=false;setTalker('');back();
  });
}
let exploreCb=null;
function onSpot(h){if(exploreCb)exploreCb(h);}
const ray=new THREE.Raycaster(),pm=new THREE.Vector2();
canvas.addEventListener('click',e=>{if(!exploreCb)return;const r=canvas.getBoundingClientRect();pm.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(pm,camera);const hit=ray.intersectObjects(hotspots.filter(h=>h.ring.visible).map(h=>h.hit))[0];if(hit)onSpot(hit.object.userData.hs);});

function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
async function playChapter(i){
  const u=C.units[i],ch=GM.chapters[i],st=W.stages[i];
  $('dialog').hidden=true;setHint(null);$('assistBubble').hidden=true;
  await chapterCard(i,u);
  $('chapNo').textContent='第'+NUM[i]+'章';$('chapTitle').textContent=u.title;
  game.stage=i;setEnv(st.environment.time);
  const v=stageView(i);placeParty(i,false,3.2);await camTo(v.pos,v.look,i===0?2.4:3.4);
  await say('companion',fill(u.lines.enter));
  await explore(i);
  await say('mentor',u.lines.guide);
  // dilemma
  const rv=chars.rival;rv.target.copy(slotPos(i,'rival')).add(new THREE.Vector3(0,0,1.2));rv.speed=2;
  if(u.unit_id==='u3'){rv.target.set(stagePos[i].x+.1,0,stagePos[i].z-.5);await sleep(700);rv.emote='hop';rv.emoteT=0;kick={t:0};}
  await say('rival',u.lines.dilemma);
  setHint(u.hints.dilemma,GM.scoring.hint_penalty);
  const order=shuffle([0,1,2]);
  const pick=await ask('narrator',u.lines.prompt,order.map(k=>u.choices[k].text));
  const choice=u.choices[order[pick]],rule=ch.beats.choices.find(c=>c.type===choice.type);
  setHint(null);$('assistBubble').hidden=true;
  setBenxin(game.benxin+rule.benxin);addScore(rule.score);
  game.history.push({unit:u,choice});
  const good=choice.type==='correct';env.pulse=1;env.pulseColor.set(good?0xFFD27A:0x2A2440);
  if(good){chars.rival.emote='slump';chars.companion.emote='hop';}else{chars.rival.emote='hop';chars.companion.emote='shake';}
  chars.rival.emoteT=chars.companion.emoteT=0;
  floatBubble('companion',good?u.reactions.companion_on_correct:u.reactions.companion_on_wrong,3600);
  await say('rival',good?u.reactions.rival_on_correct:u.reactions.rival_on_wrong);
  chars.rival.target.copy(slotPos(i,'rival'));
  if(!good){chars.mentor.emote='shake';chars.mentor.emoteT=0;}
  await say('mentor',choice.feedback);
  await gate(i,u);
}
async function gate(i,u){
  const gk=chars.gatekeeper;gk.target.copy(stagePos[i]).add(new THREE.Vector3(0,0,portrait?.6:1));gk.speed=2.2;await sleep(900);
  setHint(u.hints.gate,GM.scoring.hint_penalty);
  const wrong=new Set();const startHints=game.hints;
  for(;;){
    const idx=await ask('gatekeeper',u.gate.question,u.gate.options,wrong,true);
    if(idx===-1){setHint(null);$('assistBubble').hidden=true;game.history[game.history.length-1].gate={wrong:wrong.size,hints:game.hints-startHints};await say('gatekeeper','答案是「'+u.gate.options[u.gate.answer]+'」。'+u.gate.explain,{btn:i<C.units.length-1?'前往下一章':'看結局'});break;}
    if(idx===u.gate.answer){
      const used=game.hints-startHints;const pts=Math.max(GM.scoring.gate_min,GM.scoring.gate_first_try-wrong.size*GM.scoring.gate_wrong_penalty);
      addScore(pts);setHint(null);$('assistBubble').hidden=true;gk.emote='hop';gk.emoteT=0;
      game.history[game.history.length-1].gate={wrong:wrong.size,hints:used};
      await say('gatekeeper','答對了。'+u.gate.explain,{btn:i<C.units.length-1?'前往下一章':'看結局'});break;
    }
    wrong.add(idx);gk.emote='shake';gk.emoteT=0;
    const d=$('dialog');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');
    giveHint(true);
  }
  gk.target.copy(slotPos(i,'gatekeeper'));
}
async function ending(){
  setHint(null);$('dialog').hidden=true;setTalker('');
  const b=game.benxin,tier=GM.endings.find(e=>b>=e.min_benxin).id,E=C.endings[tier];
  env.pulse=1;env.pulseColor.set(tier==='best'?0xFFD27A:0x2A2440);
  if(tier==='best'){Object.values(chars).forEach(c=>{c.emote='hop';c.emoteT=0;});}
  await sleep(900);
  const lab={correct:['守住本心','ok'],misconception:['落入盲點','bad'],suboptimal:['未盡完善','mid']};
  const tl=game.history.map((h,i)=>{const [t,cls]=lab[h.choice.type];const right=h.unit.choices.find(c=>c.type==='correct');
    return '<li class="'+cls+'"><b>第'+NUM[i]+'章 '+h.unit.title+'</b><span class="tag">'+t+(h.gate&&(h.gate.wrong||h.gate.hints)?'，考問答錯 '+h.gate.wrong+' 次、提示 '+h.gate.hints+' 次':'')+'</span>'+
    (h.choice.type==='correct'?'<p>你的選擇：'+h.choice.text+'</p>':'<p>你的選擇：'+h.choice.text+'</p><p>孟子的看法：'+right.text+'</p>')+'</li>';}).join('');
  overlay('<div class="card"><p class="sub" style="margin:0">結局</p><h2>'+E.title+'</h2><p>'+E.text+'</p>'+
    '<div class="stats"><div><b>'+Math.round(b)+'</b>本心</div><div><b>'+game.score+'</b>分數</div><div><b>'+game.hints+'</b>提示次數</div></div>'+
    '<ol class="tl">'+tl+'</ol><p style="font-family:var(--serif)">孟子：'+C.debrief+'</p><button class="primary" id="again">再玩一次</button></div>',true);
  await waitClick('#again');location.reload();
}

async function main(){
  resize();setBenxin(50);placeParty(0,true);chars.rival.root.position.x+=0;
  camera.position.set(0,4.2,10);cam.look.set(0,1,-1.2);
  requestAnimationFrame(frame);
  await titleScreen();
  game.role=await chooseRole();
  await castScreen();clearOverlay();
  game.benxin=game.bxShown=game.role.start_value;setBenxin(game.role.start_value);
  $('hud').hidden=false;
  for(let i=0;i<C.units.length;i++)await playChapter(i);
  await ending();
}
main();
})();
</script>
